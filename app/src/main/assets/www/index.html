<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Código Master TV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
/* ===== RESET & BASE ===== */
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg-primary: #0A0D10;
  --bg-secondary: #12161C;
  --bg-card: #1A2028;
  --bg-card-hover: #232B34;
  --text-primary: #F0F2F5;
  --text-secondary: #8A94A6;
  --text-muted: #5A6473;
  --accent: #F5A623;
  --accent-dim: #7A5310;
  --accent-bg: rgba(245,166,35,0.1);
  --border-color: #2A323E;
  --shadow: 0 8px 24px rgba(0,0,0,0.6);
  --radius: 12px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
html, body { height:100%; }
body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:var(--border-color); border-radius:4px; }

/* ===== FOCUS PARA TV (más visible) ===== */
:focus { outline:none; }
*:focus {
  outline:4px solid var(--accent) !important;
  outline-offset:3px;
  border-radius:8px;
}

/* ===== ANIMACIONES MEJORADAS (equilibrio velocidad/visibilidad) ===== */
.chan-card, .series-row, .ep-row, .cat-item, .top-tab, .profile-card {
  transition: transform 0.05s ease, border-color 0.05s ease, box-shadow 0.05s ease !important;
  will-change: transform;
  backface-visibility: hidden;
}
.chan-card:hover, .chan-card:focus {
  transform: scale(1.08) translateY(-4px) !important;
  border-color: var(--accent) !important;
  box-shadow: 0 12px 32px rgba(245,166,35,0.35) !important;
}
.series-row:hover, .series-row:focus {
  transform: scale(1.04) !important;
  border-color: var(--accent) !important;
}
.chan-card.poster:hover, .chan-card.poster:focus {
  transform: scale(1.08) !important;
  box-shadow: 0 16px 40px rgba(245,166,35,0.4) !important;
}
.cat-item:hover, .cat-item:focus {
  transform: translateX(6px) !important;
}
.top-tab:hover, .top-tab:focus {
  transform: scale(1.06) !important;
}
.icon-btn:hover, .icon-btn:focus {
  transform: scale(1.12) !important;
}

/* ===== ANIMACIÓN DE ENTRADA (PÁGINA) ===== */
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(30px); }
  to { opacity:1; transform:translateY(0); }
}
#setup { animation: fadeInUp 3s ease-out both; }
#app.show { animation: fadeInUp 3s ease-out both; }

/* ===== SPLASH LOGO ANIMADO ===== */
.splash-logo {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 100;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  font-weight: 700;
  color: #0A0D10;
  box-shadow: 0 0 0 8px rgba(245,166,35,0.2);
  animation: splashAnim 5s ease-out forwards;
  pointer-events: none;
  font-family: var(--font);
}
@keyframes splashAnim {
  0% { transform: translate(-50%, -50%) scale(0.2) rotate(-180deg); opacity:0; }
  30% { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); opacity:1; }
  60% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity:1; }
  100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity:0; visibility:hidden; }
}

/* ===== SETUP ===== */
#setup {
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background: radial-gradient(ellipse at 30% 20%, rgba(245,166,35,0.06), transparent 70%);
}
.setup-card {
  width:100%;
  max-width:400px;
  background:var(--bg-secondary);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.setup-head {
  padding:28px 30px 16px;
  border-bottom:1px solid var(--border-color);
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-mark {
  width:10px; height:10px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px rgba(245,166,35,0.2);
  animation:pulse 1.8s infinite ease-in-out;
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.brand h1 { font-size:22px; font-weight:700; letter-spacing:0.5px; }
.setup-head p { color:var(--text-secondary); font-size:13px; margin-top:6px; line-height:1.5; }
.field { margin-bottom:16px; }
.field label {
  display:block;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--text-secondary);
  margin-bottom:6px;
}
.field input {
  width:100%;
  background:var(--bg-primary);
  border:1px solid var(--border-color);
  color:var(--text-primary);
  padding:10px 14px;
  border-radius:8px;
  font-size:14px;
  transition:border-color 0.2s;
}
.field input:focus { border-color:var(--accent-dim); }
.btn {
  width:100%;
  background:var(--accent);
  color:#0A0D10;
  border:none;
  padding:12px;
  border-radius:8px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  transition:filter 0.2s, transform 0.1s;
}
.btn:hover { filter:brightness(1.08); }
.btn:active { transform:scale(0.98); }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.loading-line {
  display:none;
  align-items:center;
  gap:10px;
  margin-top:14px;
  font-size:12px;
  color:var(--text-secondary);
}
.spinner {
  width:14px; height:14px;
  border:2px solid var(--border-color);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin { to{ transform:rotate(360deg); } }
.error-box {
  margin-top:14px;
  font-size:13px;
  color:#FF6B6B;
  background:rgba(255,107,107,0.08);
  border:1px solid rgba(255,107,107,0.25);
  border-radius:8px;
  padding:10px 12px;
  display:none;
}
.saved-profiles {
  padding:16px 30px 0;
}
.saved-profiles-title {
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--text-muted);
  margin-bottom:10px;
}
.profile-card {
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--bg-primary);
  border:1px solid var(--border-color);
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:8px;
  cursor:pointer;
}
.profile-card:hover { border-color:var(--accent-dim); }
.profile-icon {
  width:34px; height:34px;
  border-radius:8px;
  background:var(--bg-card);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  color:var(--accent);
}
.profile-info { flex:1; min-width:0; }
.profile-name { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.profile-sub { font-size:11px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.profile-use-btn {
  background:var(--accent);
  color:#0A0D10;
  border:none;
  padding:5px 14px;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}
.profile-delete-btn {
  background:none;
  border:1px solid var(--border-color);
  color:var(--text-muted);
  width:30px; height:30px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
}
.profile-delete-btn:hover { color:#FF6B6B; border-color:#FF6B6B; }
.saved-profiles-sep {
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--text-muted);
  font-size:10px;
  text-transform:uppercase;
  margin:14px 0 0;
  letter-spacing:1px;
}
.saved-profiles-sep::before, .saved-profiles-sep::after { content:''; flex:1; height:1px; background:var(--border-color); }

/* ===== APP SHELL ===== */
#app {
  display:none;
  height:100vh;
  grid-template-columns:240px 1fr;
  grid-template-rows:56px auto 1fr;
}
#app.show { display:grid; }

.topbar {
  grid-column:1 / 3;
  grid-row:1;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:var(--bg-secondary);
  border-bottom:1px solid var(--border-color);
  gap:16px;
}
.topbar .brand h1 { font-size:16px; }
.topbar .brand-mark { width:8px; height:8px; }
.search-wrap {
  flex:1;
  max-width:380px;
  position:relative;
}
.search-wrap input {
  width:100%;
  background:var(--bg-primary);
  border:1px solid var(--border-color);
  color:var(--text-primary);
  padding:6px 12px 6px 32px;
  border-radius:20px;
  font-size:13px;
}
.search-wrap input:focus { border-color:var(--accent-dim); }
.search-icon {
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:var(--text-muted);
  font-size:13px;
}
.top-tabs {
  display:flex;
  gap:4px;
  margin-left:auto;
}
.top-tab {
  background:none;
  border:none;
  color:var(--text-secondary);
  font-size:12px;
  font-weight:600;
  padding:6px 14px;
  border-radius:18px;
  cursor:pointer;
  transition:background 0.15s, color 0.15s, transform 0.05s;
}
.top-tab.active { background:var(--accent-bg); color:var(--accent); }
.top-tab:hover:not(.active) { color:var(--text-primary); }

.conn-name {
  font-size:11px;
  color:var(--text-muted);
  border-left:1px solid var(--border-color);
  padding-left:14px;
  max-width:140px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.icon-btn {
  background:none;
  border:1px solid var(--border-color);
  color:var(--text-secondary);
  width:34px; height:34px;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:border-color 0.15s, color 0.15s, transform 0.05s;
}
.icon-btn:hover { border-color:var(--text-muted); color:var(--text-primary); }
.icon-btn:focus { transform:scale(1.12); }

.mobile-type-tabs {
  display:none;
  grid-column:1 / 3;
  grid-row:2;
  gap:8px;
  padding:10px 14px;
  overflow-x:auto;
  border-bottom:1px solid var(--border-color);
  background:var(--bg-secondary);
}
.mobile-type-tabs .top-tab { flex-shrink:0; }

.sidebar {
  grid-column:1;
  grid-row:3;
  background:var(--bg-secondary);
  border-right:1px solid var(--border-color);
  overflow-y:auto;
  padding:14px 0;
}
.sb-title {
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.8px;
  color:var(--text-muted);
  padding:0 18px 8px;
}
.cat-item {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 18px;
  cursor:pointer;
  font-size:13px;
  color:var(--text-secondary);
  border-left:2px solid transparent;
  transition:color 0.12s, background 0.12s, transform 0.05s;
}
.cat-item:hover { color:var(--text-primary); background:rgba(255,255,255,0.02); }
.cat-item.active { color:var(--accent); border-left-color:var(--accent); background:var(--accent-bg); }
.cat-count { font-size:10px; color:var(--text-muted); font-weight:600; }

.main {
  grid-column:2;
  grid-row:3;
  overflow-y:auto;
  padding:18px 22px 40px;
  scroll-behavior: auto; /* Scroll instantáneo */
  contain: layout style paint; /* Aislamiento para mejorar rendimiento */
}
.grid-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.grid-header h2 { font-size:18px; font-weight:600; }
.grid-count { font-size:12px; color:var(--text-muted); }

.channel-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:14px;
  contain: layout style paint;
}
.channel-grid.poster-grid {
  grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:16px;
}
.chan-card {
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:12px;
  cursor:pointer;
  transition:transform 0.05s ease, border-color 0.05s ease, box-shadow 0.05s ease;
  will-change: transform;
  backface-visibility: hidden;
}
.chan-card:focus {
  transform: scale(1.08) translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 12px 32px rgba(245,166,35,0.35);
  outline: none;
}
.chan-card.playing { border-color:var(--accent); background:var(--accent-bg); }
.chan-logo-wrap {
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg-primary);
  border-radius:8px;
  overflow:hidden;
}
.chan-logo-wrap img { max-width:100%; max-height:100%; object-fit:contain; }
.chan-logo-fallback { font-size:18px; font-weight:700; color:var(--text-muted); }
.chan-name {
  font-size:13px;
  line-height:1.3;
  margin-top:8px;
  text-align:center;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.chan-meta {
  display:flex;
  justify-content:center;
  margin-top:4px;
  font-size:10px;
  color:var(--text-muted);
  font-weight:600;
}
.chan-card.poster {
  padding:0;
  border-radius:var(--radius);
  overflow:hidden;
  position:relative;
  transition:transform 0.05s ease, box-shadow 0.05s ease;
}
.chan-card.poster:focus {
  transform: scale(1.08);
  box-shadow: 0 16px 40px rgba(245,166,35,0.4);
  outline: none;
}
.chan-card.poster .chan-logo-wrap {
  height:0;
  padding-bottom:150%;
  border-radius:0;
  position:relative;
  background:linear-gradient(160deg, var(--bg-card), var(--bg-primary));
  image-rendering: auto;
}
.chan-card.poster .chan-logo-wrap img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
.chan-card.poster .chan-logo-wrap .chan-logo-fallback {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:700;
}
.chan-card.poster .chan-name {
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:24px 10px 10px;
  background:linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.5) 60%, transparent);
  font-size:13px;
  font-weight:600;
  text-align:left;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  margin:0;
  line-height:1.4;
  pointer-events:none;
}
.chan-card.poster .chan-meta { display:none; }

.series-list { display:flex; flex-direction:column; gap:8px; }
.series-row {
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:10px 14px;
  cursor:pointer;
  transition:border-color 0.05s, transform 0.05s;
}
.series-row:focus {
  transform: scale(1.04);
  border-color: var(--accent);
  outline: none;
}
.series-row img {
  width:48px; height:68px;
  object-fit:cover;
  border-radius:6px;
  background:var(--bg-primary);
}
.series-row .info { flex:1; }
.series-row .info .t { font-size:14px; font-weight:500; }
.series-row .info .g { font-size:12px; color:var(--text-secondary); }
.ep-list { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
.ep-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  transition:border-color 0.05s, transform 0.05s;
}
.ep-row:focus {
  transform: scale(1.04);
  border-color: var(--accent);
  outline: none;
}
.back-link {
  color:var(--accent);
  font-size:13px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-bottom:16px;
}

.empty-state {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:60vh;
  color:var(--text-muted);
  text-align:center;
  gap:6px;
}
.empty-state .big { font-size:14px; color:var(--text-secondary); }

#my-lists-modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  z-index:55;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(4px);
}
#my-lists-modal.show { display:flex; }
.my-lists-box {
  width:min(440px, 92vw);
  max-height:80vh;
  background:var(--bg-secondary);
  border-radius:var(--radius);
  border:1px solid var(--border-color);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.my-lists-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 18px;
  border-bottom:1px solid var(--border-color);
  font-weight:600;
  font-size:16px;
}
.my-lists-body { padding:14px 18px; overflow-y:auto; }
.my-lists-body .profile-card:last-child { margin-bottom:0; }
.my-lists-foot { padding:14px 18px; border-top:1px solid var(--border-color); }
.my-lists-empty {
  color:var(--text-secondary);
  font-size:14px;
  text-align:center;
  padding:30px 10px;
}
.close-x {
  background:none;
  border:none;
  color:var(--text-secondary);
  font-size:20px;
  cursor:pointer;
  width:32px; height:32px;
  border-radius:8px;
  transition:background 0.12s;
}
.close-x:hover { background:var(--bg-card); color:var(--text-primary); }
.close-x:focus { outline:3px solid var(--accent); }

#player-overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  z-index:50;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
#player-overlay.show { display:flex; }
.player-box {
  width:min(1100px, 94vw);
  background:#000;
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--border-color);
  box-shadow:var(--shadow);
}
.player-topline {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
  background:var(--bg-secondary);
  border-bottom:1px solid var(--border-color);
}
.player-title {
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
}
.live-dot {
  width:8px; height:8px;
  border-radius:50%;
  background:#FF4757;
  animation:pulse 1.5s infinite ease-in-out;
}
video { width:100%; display:block; max-height:70vh; background:#000; }
.player-status {
  padding:10px 16px;
  font-size:12px;
  color:var(--text-secondary);
  border-top:1px solid var(--border-color);
  background:var(--bg-secondary);
}
.player-status.err { color:#FF6B6B; }
.ext-player-btn {
  display:none;
  width:100%;
  margin-top:10px;
  background:var(--bg-card);
  border:1px solid var(--accent-dim);
  color:var(--accent);
  padding:10px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
}
.ext-player-btn.show { display:block; }
.ext-player-btn:hover { background:var(--accent-bg); }

.hamburger { display:none; }
.sidebar-scrim {
  display:none;
  position:fixed;
  inset:0;
  top:56px;
  background:rgba(0,0,0,0.5);
  z-index:35;
}
.sidebar-scrim.show { display:block; }

/* ===== OPTIMIZACIONES PARA TV BOX (Android 14) ===== */
@media (min-width: 1200px) {
  .chan-name { font-size: 14px; }
  .cat-item { font-size: 15px; padding: 10px 20px; }
  .top-tab { font-size: 14px; padding: 8px 20px; }
  .conn-name { font-size: 13px; max-width: 180px; }
  .sidebar { width: 260px; }
  .main { padding: 24px 28px 50px; }
  .grid-header h2 { font-size: 20px; }
  .grid-count { font-size: 14px; }
  .chan-card .chan-meta { font-size: 12px; }
  .chan-card .chan-logo-wrap { height: 80px; }
  .channel-grid { gap: 18px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }

<script>
(function(){
"use strict";

// ===== LISTA DE SERVIDORES PERMITIDOS (ocultos) =====
const SERVIDORES = [
  'http://zonacero.lat:8080',
  'http://liontv.es:8080',
  'http://tv.proyectox.vip:8080',
  'http://neospaxy.top:8080'
];

// ===== STATE =====
let state = {
  mode: 'xtream',
  connName: '',
  channels: [],
  categories: [],
  activeCategory: 'all',
  activeType: 'live',
  xtream: null,
  vod: [],
  vodCategories: [],
  series: [],
  seriesCategories: [],
  seriesEpisodesCache: {},
  viewingSeries: null,
  hls: null,
  renderLimit: 60
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

// ===== PERSISTENCE =====
const PROFILES_KEY = 'codigomaster_profiles';
const HISTORY_KEY = 'codigomaster_history';

function loadProfiles(){ try{ return JSON.parse(localStorage.getItem(PROFILES_KEY)) || []; }catch(e){ return []; } }
function saveProfiles(list){ try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(list)); }catch(e){} }

function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }catch(e){ return []; } }
function saveHistory(list){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }catch(e){} }

function addToHistory(title, url) {
  if (!title || !url) return;
  const history = loadHistory();
  const exists = history.some(item => item.title === title && item.url === url);
  if (!exists) {
    history.unshift({ title, url, timestamp: Date.now() });
    if (history.length > 100) history.pop();
    saveHistory(history);
  } else {
    const idx = history.findIndex(item => item.title === title && item.url === url);
    if (idx > 0) {
      const item = history.splice(idx, 1)[0];
      item.timestamp = Date.now();
      history.unshift(item);
      saveHistory(history);
    }
  }
}

function clearHistory() {
  if (confirm('¿Eliminar todo el historial de reproducción?')) {
    saveHistory([]);
    renderMain();
  }
}

function profileKeyOf(p){
  return 'xtream:' + p.xtream.server + ':' + p.xtream.user;
}
function defaultProfileName(p){
  return p.xtream.user;
}
function upsertProfile(profile, customName){
  const list = loadProfiles();
  const key = profileKeyOf(profile);
  const existing = list.find(p => profileKeyOf(p) === key);
  const name = customName || (existing && existing.name) || profile.xtream.user;
  const entry = Object.assign({}, profile, { name, lastUsed: Date.now(), id: (existing && existing.id) || (Date.now()+''+Math.random().toString(36).slice(2,7)) });
  saveProfiles(list.filter(p => profileKeyOf(p) !== key).concat(entry));
}
function deleteProfile(id){ saveProfiles(loadProfiles().filter(p => p.id !== id)); renderSavedProfiles(); }
function mostRecentProfile(){ const list = loadProfiles(); if(!list.length) return null; return list.sort((a,b)=> (b.lastUsed||0) - (a.lastUsed||0))[0]; }

function profileCardsHtml(list, currentKey){
  if(!list.length) return '';
  let html = '';
  list.forEach(p=>{
    const sub = p.xtream.user;
    const icon = '👤';
    const isCurrent = currentKey && profileKeyOf(p) === currentKey;
    html += `<div class="profile-card" data-id="${escapeAttr(p.id)}">
      <div class="profile-icon">${icon}</div>
      <div class="profile-info">
        <div class="profile-name">${escapeHtml(p.name)}${isCurrent ? ' <span style="color:var(--accent);font-size:10px;">●</span>' : ''}</div>
        <div class="profile-sub">${escapeHtml(sub)}</div>
      </div>
      ${isCurrent ? '' : `<button class="profile-use-btn" data-use="${escapeAttr(p.id)}">Usar</button>`}
      <button class="profile-delete-btn" data-del="${escapeAttr(p.id)}">🗑</button>
    </div>`;
  });
  return html;
}
function renderSavedProfiles(){
  const box = $('#saved-profiles');
  const list = loadProfiles().sort((a,b)=> (b.lastUsed||0) - (a.lastUsed||0));
  if(!list.length){ box.style.display = 'none'; box.innerHTML = ''; return; }
  let html = `<div class="saved-profiles-title">Tus cuentas guardadas</div>`;
  html += profileCardsHtml(list, currentProfileKey());
  html += `<div class="saved-profiles-sep">o agrega una nueva</div>`;
  box.innerHTML = html;
  box.style.display = 'block';
  box.querySelectorAll('[data-use]').forEach(b=> b.addEventListener('click', ()=> useProfile(b.dataset.use)));
  box.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', (e)=>{ e.stopPropagation(); deleteProfile(b.dataset.del); }));
}
function currentProfileKey(){
  if(!state.xtream) return null;
  return profileKeyOf({ mode:'xtream', xtream:{ server: state.xtream.base, user: state.xtream.user } });
}
function renderMyListsModal(){
  const body = $('#my-lists-body');
  const list = loadProfiles().sort((a,b)=> (b.lastUsed||0) - (a.lastUsed||0));
  if(!list.length){ body.innerHTML = `<div class="my-lists-empty">Aún no tienes cuentas guardadas.</div>`; return; }
  body.innerHTML = profileCardsHtml(list, currentProfileKey());
  body.querySelectorAll('[data-use]').forEach(b=> b.addEventListener('click', async ()=>{ closeMyListsModal(); await useProfile(b.dataset.use); }));
  body.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', (e)=>{ e.stopPropagation(); deleteProfile(b.dataset.del); renderMyListsModal(); }));
}
function openMyListsModal(){ renderMyListsModal(); $('#my-lists-modal').classList.add('show'); }
function closeMyListsModal(){ $('#my-lists-modal').classList.remove('show'); }

// ===== EVENT LISTENERS =====
$('#my-lists-btn').addEventListener('click', openMyListsModal);
$('#my-lists-close').addEventListener('click', closeMyListsModal);
$('#my-lists-modal').addEventListener('click', e=>{ if(e.target.id === 'my-lists-modal') closeMyListsModal(); });
$('#my-lists-add-btn').addEventListener('click', ()=>{ closeMyListsModal(); $('#disconnect-btn').click(); });

$('#hamburger-btn').addEventListener('click', ()=>{ $('#sidebar').classList.toggle('open'); $('#sidebar-scrim').classList.toggle('show'); });
$('#sidebar-scrim').addEventListener('click', ()=>{ $('#sidebar').classList.remove('open'); $('#sidebar-scrim').classList.remove('show'); });

$('#x-load-btn').addEventListener('click', ()=> connectXtream());
$('#disconnect-btn').addEventListener('click', disconnectApp);
$('#player-close').addEventListener('click', closePlayer);
$('#player-close').addEventListener('keydown', function(e){ const kc = e.keyCode || e.which; if(e.key === 'Enter' || e.key === ' ' || kc === 13 || kc === 23 || kc === 32 || kc === 66) { e.preventDefault(); closePlayer(); } });

// ===== HELPERS =====
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }
function makeActivatable(el, handler){
  el.setAttribute('tabindex','0');
  el.setAttribute('role','button');
  el.addEventListener('click', handler);
  el.addEventListener('keydown', e=>{
    const kc = e.keyCode || e.which;
    if (e.key === 'Enter' || e.key === ' ' || kc === 13 || kc === 23 || kc === 32 || kc === 66) {
      e.preventDefault();
      e.stopPropagation();
      handler();
    }
  });
}
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#sidebar-scrim').classList.remove('show'); }

// ===== XTREAM =====
async function xtreamApi(base, user, pass, action, extra){ 
  const url = `${base}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}${action ? '&action='+action : ''}${extra||''}`; 
  const res = await fetch(url); 
  if(!res.ok) throw new Error('HTTP '+res.status); 
  return res.json(); 
}

async function useProfile(id){
  const p = loadProfiles().find(x => x.id === id);
  if(!p) return;
  if(p.mode === 'xtream' && p.xtream) {
    await connectXtream({ server: p.xtream.server, user: p.xtream.user, pass: p.xtream.pass, name: p.name });
  } else {
    alert('Esta versión solo soporta cuentas Xtream.');
  }
}

async function connectXtream(opts){
  opts = opts || {};
  let base = opts.server || SERVIDORES[0];
  if(!SERVIDORES.includes(base)){
    $('#x-error').textContent = 'Servidor no autorizado.';
    $('#x-error').style.display = 'block';
    return false;
  }
  const user = opts.user !== undefined ? opts.user : $('#x-user').value.trim();
  const pass = opts.pass !== undefined ? opts.pass : $('#x-pass').value;
  const customName = opts.name !== undefined ? opts.name : undefined;
  const errBox = $('#x-error');
  const loading = $('#x-loading');
  errBox.style.display = 'none';
  if(!user || !pass){ errBox.textContent = 'Ingresa usuario y contraseña.'; errBox.style.display = 'block'; return false; }
  loading.style.display = 'flex';
  
  let serversToTry = opts.server ? [opts.server] : SERVIDORES;
  
  for (let baseTry of serversToTry) {
    try {
      const auth = await xtreamApi(baseTry, user, pass);
      
      let isValid = false;
      let userInfo = null;
      
      if (auth && auth.user_info && auth.user_info.auth === 1) {
        isValid = true;
        userInfo = auth.user_info;
      }
      else if (auth && auth.auth === 1) {
        isValid = true;
        userInfo = auth.user_info || auth;
      }
      else if (auth && auth.user_info && auth.user_info.username) {
        isValid = true;
        userInfo = auth.user_info;
      }
      else if (auth && auth.user_info) {
        isValid = true;
        userInfo = auth.user_info;
      }
      else if (auth && typeof auth === 'object' && auth.username) {
        isValid = true;
        userInfo = auth;
      }
      
      if (!isValid) {
        throw new Error('Credenciales inválidas o respuesta inesperada');
      }
      
      const liveCats = await xtreamApi(baseTry, user, pass, 'get_live_categories').catch(()=>[]);
      const liveStreams = await xtreamApi(baseTry, user, pass, 'get_live_streams').catch(()=>[]);
      const vodCats = await xtreamApi(baseTry, user, pass, 'get_vod_categories').catch(()=>[]);
      const vodStreams = await xtreamApi(baseTry, user, pass, 'get_vod_streams').catch(()=>[]);
      const seriesCats = await xtreamApi(baseTry, user, pass, 'get_series_categories').catch(()=>[]);
      const seriesList = await xtreamApi(baseTry, user, pass, 'get_series').catch(()=>[]);

      const catNameById = {}; liveCats.forEach(c=> catNameById[c.category_id] = c.category_name);
      const channels = liveStreams.map(s=>({ name: s.name, logo: s.stream_icon || '', group: catNameById[s.category_id] || 'General', catId: s.category_id, streamId: s.stream_id, url: `${baseTry}/live/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${s.stream_id}.m3u8` }));

      const vodCatNameById = {}; vodCats.forEach(c=> vodCatNameById[c.category_id] = c.category_name);
      const vod = vodStreams.map(s=>({ name: s.name, logo: s.stream_icon || '', group: vodCatNameById[s.category_id] || 'General', catId: s.category_id, streamId: s.stream_id, url: `${baseTry}/movie/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${s.stream_id}.${s.container_extension || 'mp4'}` }));

      const seriesCatNameById = {}; seriesCats.forEach(c=> seriesCatNameById[c.category_id] = c.category_name);
      const series = seriesList.map(s=>({ name: s.name, logo: s.cover || '', group: seriesCatNameById[s.category_id] || 'General', catId: s.category_id, seriesId: s.series_id }));

      state.mode = 'xtream';
      state.xtream = { base: baseTry, user, pass };
      
      let expDateRaw = null;
      if (userInfo) {
        if (userInfo.exp_date) expDateRaw = userInfo.exp_date;
        else if (userInfo.expiration_date) expDateRaw = userInfo.expiration_date;
        else if (userInfo.expire_date) expDateRaw = userInfo.expire_date;
        else if (userInfo.expiry_date) expDateRaw = userInfo.expiry_date;
      }
      if (!expDateRaw && auth) {
        if (auth.exp_date) expDateRaw = auth.exp_date;
        else if (auth.expiration_date) expDateRaw = auth.expiration_date;
        else if (auth.expire_date) expDateRaw = auth.expire_date;
        else if (auth.expiry_date) expDateRaw = auth.expiry_date;
      }
      let formattedDate = 'Ilimitado';
      if (expDateRaw && parseInt(expDateRaw) > 0) {
        const d = new Date(parseInt(expDateRaw) * 1000);
        formattedDate = d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
      }
      state.connName = user + ' | ' + formattedDate;

      state.channels = channels;
      state.categories = buildCategoriesFromChannels(channels);
      state.vod = vod;
      state.vodCategories = buildCategoriesFromChannels(vod);
      state.series = series;
      state.seriesCategories = buildCategoriesFromChannels(series);
      loading.style.display = 'none';
      upsertProfile({ mode: 'xtream', xtream: { server: baseTry, user, pass } }, customName);
      launchApp();
      return true;
    } catch(e) {
      // Continuar con el siguiente servidor
    }
  }
  
  loading.style.display = 'none';
  errBox.textContent = 'Error: No se pudo conectar con ningún servidor. Verifica tus credenciales.';
  errBox.style.display = 'block';
  return false;
}

function buildCategoriesFromChannels(channels){
  const map = {};
  channels.forEach(c=>{ const g = c.group || 'General'; map[g] = (map[g]||0)+1; });
  return Object.keys(map).sort((a,b)=>a.localeCompare(b)).map(name=>({id:name, name, count:map[name]}));
}

// ===== HISTORIAL =====
function renderHistoryView(main) {
  const history = loadHistory();
  let html = `<div class="grid-header"><h2>📜 Historial</h2><span class="grid-count">${history.length} elementos</span></div>`;
  if (history.length === 0) {
    html += `<div class="empty-state"><div style="font-size:36px;">📭</div><div>No hay elementos en el historial</div><div class="big">Las películas y series que veas aparecerán aquí</div></div>`;
  } else {
    html += `<div class="series-list">`;
    history.forEach((item, idx) => {
      html += `<div class="series-row" data-idx="${idx}">
        <div style="width:48px;height:68px;background:var(--bg-primary);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);">▶</div>
        <div class="info"><div class="t">${escapeHtml(item.title)}</div><div class="g">${new Date(item.timestamp).toLocaleDateString('es-ES')}</div></div>
        <span style="color:var(--text-muted);font-size:11px;">↻</span>
      </div>`;
    });
    html += `</div>`;
    html += `<div style="margin-top:18px;text-align:center;"><button class="btn-ghost" id="clear-history-btn" style="width:auto;padding:10px 24px;">🗑 Eliminar todo el historial</button></div>`;
  }
  main.innerHTML = html;
  $$('.series-row').forEach(el => {
    makeActivatable(el, ()=>{
      const idx = parseInt(el.dataset.idx);
      const item = loadHistory()[idx];
      if (item && item.url) {
        playStream(item.url, item.title);
      }
    });
  });
  const clearBtn = document.getElementById('clear-history-btn');
  if (clearBtn) clearBtn.addEventListener('click', clearHistory);
}

// ===== NAVEGACIÓN CON HISTORIAL Y DOBLE TOQUE ATRÁS (con confirm) =====
let backPressCount = 0;
let backPressTimer = null;

function handleBackPress() {
  if (backPressTimer) {
    clearTimeout(backPressTimer);
    backPressTimer = null;
    if (confirm('¿Estás seguro de que quieres salir de la aplicación?')) {
      if (window.close) window.close();
      window.location.href = 'about:blank';
    }
    return;
  }
  backPressCount++;
  alert('Presiona atrás otra vez para salir');
  backPressTimer = setTimeout(() => {
    backPressCount = 0;
    backPressTimer = null;
  }, 2000);
}

window.addEventListener('popstate', function(event) {
  const stateData = event.state;
  if (stateData) {
    if (stateData.activeType) state.activeType = stateData.activeType;
    if (stateData.activeCategory) state.activeCategory = stateData.activeCategory;
    if (stateData.viewingSeries) {
      const found = state.series.find(s => s.seriesId === stateData.viewingSeries);
      state.viewingSeries = found || null;
    } else {
      state.viewingSeries = null;
    }
    renderTabs();
    renderSidebar();
    renderMain();
    closeSidebar();
  } else {
    handleBackPress();
  }
});

// ===== MANEJO DE BOTONES DEL MANDO (optimizado) =====
document.addEventListener('keydown', function(e) {
  const key = e.key;
  const keyCode = e.keyCode || e.which;
  
  const playerOverlay = document.getElementById('player-overlay');
  const video = document.getElementById('video');
  const isBackKey = (
    key === 'Escape' || key === 'Back' || key === 'GoBack' || key === 'BrowserBack' ||
    key === 'Exit' || key === 'XF86Back' ||
    keyCode === 27 || keyCode === 4 || keyCode === 8 ||
    keyCode === 166 || keyCode === 10009 || keyCode === 461
  );

  if (playerOverlay && playerOverlay.classList.contains('show') && video) {
    if (key === 'Enter' || keyCode === 13 || keyCode === 23 || keyCode === 66 || key === 'MediaPlayPause' || keyCode === 85) {
      e.preventDefault();
      if (video.paused) video.play(); else video.pause();
      return;
    }
    if (key === 'ArrowRight' || keyCode === 39 || keyCode === 22 || key === 'MediaNextTrack' || keyCode === 87) {
      e.preventDefault();
      video.currentTime += 10;
      return;
    }
    if (key === 'ArrowLeft' || keyCode === 37 || keyCode === 21 || key === 'MediaPreviousTrack' || keyCode === 88) {
      e.preventDefault();
      video.currentTime -= 10;
      return;
    }
    if (isBackKey) {
      e.preventDefault();
      closePlayer();
      return;
    }
    if (key === 'Menu' || keyCode === 82) {
      e.preventDefault();
      closePlayer();
      return;
    }
    return;
  }
  
  if ($('#my-lists-modal').classList.contains('show')) {
    if (isBackKey) {
      e.preventDefault();
      closeMyListsModal();
      return;
    }
    return;
  }
  
  if (key === 'ArrowUp' || keyCode === 38 || keyCode === 19) {
    e.preventDefault();
    navigateFocus('up');
    return;
  }
  if (key === 'ArrowDown' || keyCode === 40 || keyCode === 20) {
    e.preventDefault();
    navigateFocus('down');
    return;
  }
  if (key === 'ArrowLeft' || keyCode === 37 || keyCode === 21) {
    e.preventDefault();
    navigateFocus('left');
    return;
  }
  if (key === 'ArrowRight' || keyCode === 39 || keyCode === 22) {
    e.preventDefault();
    navigateFocus('right');
    return;
  }
  
  if (key === 'Enter' || keyCode === 13 || keyCode === 23 || keyCode === 66) {
    e.preventDefault();
    const active = document.activeElement;
    if (active && active !== document.body && typeof active.click === 'function') {
      active.click();
    }
    return;
  }

  if (isBackKey) {
    e.preventDefault();
    window.history.back();
    return;
  }
  
  if ((key === 'Menu' || keyCode === 82) && !$('#my-lists-modal').classList.contains('show')) {
    e.preventDefault();
    openMyListsModal();
    return;
  }
  
  if (key === 'Search' || keyCode === 84) {
    e.preventDefault();
    const searchInput = document.getElementById('search-input');
    if (searchInput) searchInput.focus();
    return;
  }
  
  if (document.activeElement === document.body) {
    const firstFocusable = document.querySelector('[tabindex="0"]:not([tabindex="-1"])');
    if (firstFocusable) firstFocusable.focus();
  }
});

// Navegación espacial optimizada
function navigateFocus(direction) {
  const focusables = Array.from(document.querySelectorAll('[tabindex="0"]:not([tabindex="-1"])'))
    .filter(el => {
      const r = el.getBoundingClientRect();
      return r.width > 0 && r.height > 0 && el.offsetParent !== null;
    });
  if (focusables.length === 0) return;

  const current = document.activeElement;
  if (!current || current === document.body || !focusables.includes(current)) {
    const first = focusables[0];
    first.focus();
    first.scrollIntoView({ block: 'center', behavior: 'auto' });
    return;
  }

  const curRect = current.getBoundingClientRect();
  const curCx = curRect.left + curRect.width / 2;
  const curCy = curRect.top + curRect.height / 2;

  let best = null;
  let bestScore = Infinity;
  for (const el of focusables) {
    if (el === current) continue;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const dx = cx - curCx;
    const dy = cy - curCy;
    let primary, cross, valid;
    if (direction === 'up') { valid = dy < -1; primary = -dy; cross = Math.abs(dx); }
    else if (direction === 'down') { valid = dy > 1; primary = dy; cross = Math.abs(dx); }
    else if (direction === 'left') { valid = dx < -1; primary = -dx; cross = Math.abs(dy); }
    else { valid = dx > 1; primary = dx; cross = Math.abs(dy); }
    if (!valid) continue;
    const score = cross * 3 + primary;
    if (score < bestScore) { bestScore = score; best = el; }
  }

  if (best) {
    best.focus();
    best.scrollIntoView({ block: 'center', behavior: 'auto' });
  }
}

// ===== APP LAUNCH =====
function launchApp(){
  $('#setup').style.display = 'none';
  $('#app').classList.add('show');
  $('#conn-name').textContent = state.connName;
  const tabsWrap = $('#top-tabs');
  const mobileTabsWrap = $('#mobile-type-tabs');
  tabsWrap.innerHTML = ''; mobileTabsWrap.innerHTML = '';
  const onTabClick = (key)=>{ 
    state.activeType = key; 
    state.renderLimit = 60; 
    state.activeCategory = 'all'; 
    state.viewingSeries = null; 
    renderTabs(); 
    renderSidebar(); 
    renderMain(); 
    closeSidebar();
    pushHistoryState();
  };
  const tabs = [
    ['live','TV en vivo'],
    ['vod','Películas'],
    ['series','Series'],
    ['history','📜 Historial']
  ];
  tabs.forEach(([key,label])=>{
    [tabsWrap, mobileTabsWrap].forEach(container=>{
      const b = document.createElement('button');
      b.className = 'top-tab' + (key===state.activeType ? ' active' : '');
      b.dataset.key = key;
      b.textContent = label;
      b.addEventListener('click', ()=> onTabClick(key));
      container.appendChild(b);
    });
  });
  renderSidebar();
  renderMain();
  $('#search-input').oninput = ()=>{ state.renderLimit = 60; renderMain(); };
  pushHistoryState();
  setTimeout(() => {
    const firstFocusable = document.querySelector('.top-tab') || document.querySelector('.cat-item');
    if (firstFocusable) firstFocusable.focus();
  }, 100);
}
function renderTabs(){ $$('.top-tab').forEach(b=> b.classList.toggle('active', b.dataset.key === state.activeType)); }
function currentDataset(){
  if(state.activeType === 'live') return state.channels;
  if(state.activeType === 'vod') return state.vod;
  if(state.activeType === 'series') return state.series;
  return state.channels;
}
function currentCategories(){
  if(state.activeType === 'live') return state.categories;
  if(state.activeType === 'vod') return state.vodCategories;
  if(state.activeType === 'series') return state.seriesCategories;
  return state.categories;
}
function renderSidebar(){
  const sb = $('#sidebar');
  if (state.activeType === 'history') {
    sb.innerHTML = `<div class="sb-title">Historial</div><div class="cat-item active" data-cat="all"><span>📜 Todos</span></div>`;
    return;
  }
  const cats = currentCategories();
  const total = currentDataset().length;
  let html = `<div class="sb-title">Categorías</div>`;
  html += `<div class="cat-item ${state.activeCategory==='all'?'active':''}" data-cat="all"><span>Todos</span><span class="cat-count">${total}</span></div>`;
  cats.forEach(c=>{ html += `<div class="cat-item ${state.activeCategory===c.id?'active':''}" data-cat="${escapeAttr(c.id)}"><span>${escapeHtml(c.name)}</span><span class="cat-count">${c.count}</span></div>`; });
  sb.innerHTML = html;
  $$('.cat-item').forEach(el=>{ makeActivatable(el, ()=>{ 
    state.activeCategory = el.dataset.cat; 
    state.renderLimit = 60; 
    state.viewingSeries = null; 
    renderSidebar(); 
    renderMain(); 
    closeSidebar();
    pushHistoryState();
  }); });
}
function renderMain(){
  const main = $('#main');
  const query = $('#search-input').value.trim().toLowerCase();
  
  if (state.activeType === 'history') {
    renderHistoryView(main);
    return;
  }
  
  if(state.activeType === 'series' && state.viewingSeries){ 
    renderSeriesDetail(main, state.viewingSeries); 
    return; 
  }
  let data = currentDataset();
  if(state.activeCategory !== 'all') data = data.filter(c => c.group === state.activeCategory);
  if(query) data = data.filter(c => c.name.toLowerCase().includes(query));
  const label = {live:'TV en vivo', vod:'Películas', series:'Series'}[state.activeType];
  let html = `<div class="grid-header"><h2>${label}${state.activeCategory!=='all' ? ' — '+escapeHtml(state.activeCategory) : ''}</h2><span class="grid-count">${data.length} elementos</span></div>`;
  if(!data.length){ main.innerHTML = html + `<div class="empty-state"><div style="font-size:36px;">📡</div><div>Sin resultados</div></div>`; return; }
  const limit = Math.min(state.renderLimit || 60, data.length);
  const visible = data.slice(0, limit);
  const hasMore = data.length > limit;
  if(state.activeType === 'series'){
    html += `<div class="series-list">`;
    visible.forEach((s, idx)=>{ html += `<div class="series-row" data-idx="${idx}">${s.logo ? `<img loading="lazy" src="${escapeAttr(s.logo)}" onerror="this.style.display='none'">` : `<div style="width:48px;height:68px;background:var(--bg-primary);border-radius:6px;"></div>`}<div class="info"><div class="t">${escapeHtml(s.name)}</div><div class="g">${escapeHtml(s.group)}</div></div><span style="color:var(--text-muted);">▸</span></div>`; });
    html += `</div>`;
    if(hasMore) html += `<div style="text-align:center;margin-top:18px;"><button class="btn-ghost" id="load-more-btn">Cargar más (${limit} de ${data.length})</button></div>`;
    main.innerHTML = html;
    $$('.series-row').forEach(el=>{ makeActivatable(el, ()=>{ const s = visible[parseInt(el.dataset.idx)]; state.viewingSeries = s; renderMain(); pushHistoryState(); }); });
    const moreBtn = $('#load-more-btn');
    if(moreBtn) moreBtn.addEventListener('click', ()=>{ state.renderLimit = limit + 60; renderMain(); });
    return;
  }
  const isPosterView = (state.activeType === 'vod' || state.activeType === 'series');
  html += `<div class="channel-grid${isPosterView ? ' poster-grid' : ''}">`;
  visible.forEach((c, idx)=>{
    const posterNameHtml = isPosterView ? `<div class="chan-name">${escapeHtml(c.name)}</div>` : '';
    html += `<div class="chan-card${isPosterView ? ' poster' : ''}" data-idx="${idx}">
      <div class="chan-logo-wrap">
        ${c.logo ? `<img loading="lazy" src="${escapeAttr(c.logo)}" onerror="this.parentElement.innerHTML='<div class=&quot;chan-logo-fallback&quot;>${escapeHtml((c.name||'?').slice(0,2).toUpperCase())}</div>'">` : `<div class="chan-logo-fallback">${escapeHtml((c.name||'?').slice(0,2).toUpperCase())}</div>`}
        ${posterNameHtml}
      </div>
      ${!isPosterView ? `<div class="chan-name">${escapeHtml(c.name)}</div>` : ''}
      <div class="chan-meta">${String(idx+1).padStart(3,'0')}</div>
    </div>`;
  });
  html += `</div>`;
  if(hasMore) html += `<div style="text-align:center;margin-top:18px;"><button class="btn-ghost" id="load-more-btn">Cargar más (${limit} de ${data.length})</button></div>`;
  main.innerHTML = html;
  $$('.chan-card').forEach(el=>{ makeActivatable(el, ()=>{ const c = visible[parseInt(el.dataset.idx)]; playStream(c.url, c.name); }); });
  const moreBtn = $('#load-more-btn');
  if(moreBtn) moreBtn.addEventListener('click', ()=>{ state.renderLimit = limit + 60; renderMain(); });
}

async function renderSeriesDetail(main, series){
  main.innerHTML = `<div class="back-link" id="back-to-series">← Volver a Series</div><div class="grid-header"><h2>${escapeHtml(series.name)}</h2></div><div style="color:var(--text-secondary);">Cargando episodios…</div>`;
  $('#back-to-series').addEventListener('click', ()=>{ state.viewingSeries = null; renderMain(); pushHistoryState(); });
  try{
    const {base, user, pass} = state.xtream;
    let info = state.seriesEpisodesCache[series.seriesId];
    if(!info){ info = await xtreamApi(base, user, pass, 'get_series_info', '&series_id='+series.seriesId); state.seriesEpisodesCache[series.seriesId] = info; }
    const episodes = info.episodes || {};
    const seasons = Object.keys(episodes).sort((a,b)=>parseInt(a)-parseInt(b));
    let html = `<div class="back-link" id="back-to-series2">← Volver a Series</div><div class="grid-header"><h2>${escapeHtml(series.name)}</h2></div>`;
    if(!seasons.length){ html += `<div class="empty-state"><div>No hay episodios disponibles</div></div>`; }
    seasons.forEach(season=>{ html += `<div class="sb-title" style="padding-left:0;margin-top:14px;">Temporada ${season}</div><div class="ep-list">`; episodes[season].forEach(ep=>{ html += `<div class="ep-row" data-season="${season}" data-epid="${ep.id}"><span>${ep.episode_num}. ${escapeHtml(ep.title || 'Episodio '+ep.episode_num)}</span><span style="color:var(--accent);">▶</span></div>`; }); html += `</div>`; });
    main.innerHTML = html;
    $('#back-to-series2').addEventListener('click', ()=>{ state.viewingSeries = null; renderMain(); pushHistoryState(); });
    $$('.ep-row').forEach(el=>{ makeActivatable(el, ()=>{ const season = el.dataset.season; const epId = el.dataset.epid; const ep = episodes[season].find(e=>String(e.id)===epId); const {base, user, pass} = state.xtream; const ext = ep.container_extension || 'mp4'; const url = `${base}/series/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${ep.id}.${ext}`; playStream(url, `${series.name} — T${season}E${ep.episode_num}`); }); });
  }catch(err){ main.innerHTML = `<div class="back-link" id="back-to-series3">← Volver a Series</div><div class="error-box" style="display:block;">Error: ${escapeHtml(err.message)}</div>`; $('#back-to-series3').addEventListener('click', ()=>{ state.viewingSeries = null; renderMain(); pushHistoryState(); }); }
}

// ===== PLAYER =====
const video = $('#video');
const extBtn = $('#ext-player-btn');
function openInExternalPlayer(url, title){
  if(window.AndroidBridge && typeof window.AndroidBridge.openExternal === 'function'){ window.AndroidBridge.openExternal(url, title); }
  else { window.open(url, '_blank'); }
}
function playStream(url, title){
  addToHistory(title, url);
  
  if(window.AndroidBridge && typeof window.AndroidBridge.playNative === 'function'){ window.AndroidBridge.playNative(url, title); return; }
  $('#player-overlay').classList.add('show');
  $('#player-title-text').textContent = title;
  const status = $('#player-status');
  status.classList.remove('err');
  extBtn.classList.remove('show');
  extBtn.onclick = ()=> openInExternalPlayer(url, title);
  if(state.hls){ state.hls.destroy(); state.hls = null; }
  video.pause(); video.removeAttribute('src'); video.load();
  const isM3U8 = /\.m3u8($|\?)/i.test(url);
  if(isM3U8 && window.Hls && Hls.isSupported()){
    status.textContent = 'Conectando…';
    
    let reloadAttempts = 0;
    const MAX_RELOAD_ATTEMPTS = 3;
    
    const hls = new Hls({
      maxBufferLength: 60,
      liveDurationInfinity: true,
      liveSyncDurationCount: 3,
      backbufferLength: 30,
      enableWorker: true,
      lowLatencyMode: false,
      autoLevelCapping: -1,
      maxBufferSize: 60 * 1024 * 1024,
      recoverAttempts: 5,
      manifestLoadTimeout: 30000,
      levelLoadingTimeout: 30000,
      startLevel: -1
    });
    
    state.hls = hls;
    hls.loadSource(url);
    hls.attachMedia(video);
    
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
      status.textContent = 'Reproduciendo en vivo';
      video.play().catch(()=>{});
    });
    
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (data.fatal) {
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR ||
            data.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR ||
            data.details === Hls.ErrorDetails.LEVEL_LOAD_ERROR) {
          if (reloadAttempts < MAX_RELOAD_ATTEMPTS) {
            reloadAttempts++;
            status.textContent = `Reintentando (${reloadAttempts}/${MAX_RELOAD_ATTEMPTS})...`;
            setTimeout(() => {
              if (state.hls) {
                state.hls.loadSource(url);
                state.hls.attachMedia(video);
              }
            }, 3000);
            return;
          } else {
            status.classList.add('err');
            status.textContent = 'Error: No se pudo cargar el stream (fuente inaccesible).';
            extBtn.classList.add('show');
            return;
          }
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          status.textContent = 'Recuperando error de medios...';
          hls.recoverMediaError();
          return;
        }
        status.classList.add('err');
        status.textContent = 'Error de reproducción';
        extBtn.classList.add('show');
      }
    });
    
    video.addEventListener('error', function onVideoError() {
      if (this._reloading) return;
      this._reloading = true;
      status.textContent = 'Reintentando...';
      setTimeout(() => {
        if (state.hls) {
          state.hls.loadSource(url);
          state.hls.attachMedia(video);
        }
        this._reloading = false;
      }, 3000);
      this.removeEventListener('error', onVideoError);
    }, {once: true});
    
  } else if(video.canPlayType('application/vnd.apple.mpegurl') || video.canPlayType('video/mp4')){
    status.textContent = 'Conectando…';
    video.src = url;
    video.addEventListener('loadedmetadata', ()=>{ status.textContent = 'Reproduciendo'; }, {once:true});
    video.play().catch(()=>{});
  } else {
    status.textContent = 'Formato no soportado aquí. Prueba con reproductor externo.';
    extBtn.classList.add('show');
  }
  video.addEventListener('error', ()=>{ status.classList.add('err'); status.textContent = 'Error al reproducir'; extBtn.classList.add('show'); }, {once:true});
  $$('.chan-card').forEach(el=>el.classList.remove('playing'));
}
function closePlayer(){
  $('#player-overlay').classList.remove('show');
  extBtn.classList.remove('show');
  if(state.hls){ state.hls.destroy(); state.hls = null; }
  video.pause(); video.removeAttribute('src'); video.load();
}
function disconnectApp(){
  if(state.hls){ state.hls.destroy(); state.hls = null; }
  video.pause(); video.removeAttribute('src'); video.load();
  $('#player-overlay').classList.remove('show');
  $('#app').classList.remove('show');
  $('#setup').style.display = 'flex';
  $('#x-user').value = ''; $('#x-pass').value = '';
  state = {mode:'xtream', connName:'', channels:[], categories:[], activeCategory:'all', activeType:'live', xtream:null, vod:[], vodCategories:[], series:[], seriesCategories:[], seriesEpisodesCache:{}, viewingSeries:null, hls:null, renderLimit:60};
  renderSavedProfiles();
  window.history.pushState(null, '', '');
}

// ===== AUTO-RECONNECT =====
async function tryAutoReconnect(){
  renderSavedProfiles();
  const saved = mostRecentProfile();
  if(!saved) return;
  const autoBox = $('#auto-reconnect');
  autoBox.style.display = 'flex';
  if(!SERVIDORES.includes(saved.xtream.server)){
    autoBox.style.display = 'none';
    return;
  }
  const ok = await connectXtream({ server: saved.xtream.server, user: saved.xtream.user, pass: saved.xtream.pass, name: saved.name });
  autoBox.style.display = 'none';
  if(!ok){ 
    $('#x-user').value = saved.xtream.user || '';
    $('#x-pass').value = saved.xtream.pass || '';
  }
}
tryAutoReconnect();

})();
