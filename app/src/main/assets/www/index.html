<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Código Master TV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
/* ===== RESET & BASE ===== */
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg-primary: #000000;
  --bg-secondary: #0B0B0D;
  --bg-card: #161618;
  --bg-card-hover: #1E1E20;
  --text-primary: #F5F5F7;
  --text-secondary: #98989D;
  --text-muted: #6E6E73;
  --accent: #F5A623;
  --accent-dim: #7A5310;
  --accent-bg: rgba(245,166,35,0.08);
  --border-color: rgba(255,255,255,0.08);
  --shadow: 0 2px 10px rgba(0,0,0,0.35);
  --radius: 12px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
html, body { height:100%; }
body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:var(--border-color); border-radius:4px; }

/* ===== FOCUS PARA TV (fino y sutil, sin sombras pesadas) ===== */
*:focus { outline:none; }
*:focus {
  box-shadow: 0 0 0 2px var(--accent) !important;
}

/* ===== SELECCIÓN INSTANTÁNEA (sin animación, sin lag) ===== */
.chan-card, .series-row, .ep-row, .cat-item, .top-tab, .profile-card {
  transition: none !important;
}
.chan-card:hover, .chan-card:focus {
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 2px var(--accent) !important;
}
.series-row:hover, .series-row:focus {
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 2px var(--accent) !important;
}
.chan-card.poster:hover, .chan-card.poster:focus {
  box-shadow: 0 0 0 2px var(--accent) !important;
}
.cat-item:hover, .cat-item:focus {
  box-shadow: inset 2px 0 0 var(--accent) !important;
  background: rgba(255,255,255,0.04) !important;
  border-radius: 8px;
}
.top-tab:hover, .top-tab:focus {
  box-shadow: 0 0 0 1px var(--accent) !important;
}
.icon-btn:hover, .icon-btn:focus {
  box-shadow: 0 0 0 1px var(--accent) !important;
}

/* ===== ANIMACIÓN DE ENTRADA (PÁGINA) ===== */
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(30px); }
  to { opacity:1; transform:translateY(0); }
}
#setup { animation: fadeInUp 0.5s ease-out both; }
#app.show { animation: fadeInUp 0.5s ease-out both; }

/* ===== SPLASH LOGO ANIMADO ===== */
.splash-logo {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 100;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  font-weight: 700;
  color: #0A0D10;
  box-shadow: 0 0 0 8px rgba(245,166,35,0.2);
  animation: splashAnim 1.8s ease-out forwards;
  pointer-events: none;
  font-family: var(--font);
}
@keyframes splashAnim {
  0% { transform: translate(-50%, -50%) scale(0.2) rotate(-180deg); opacity:0; }
  30% { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); opacity:1; }
  60% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity:1; }
  100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity:0; visibility:hidden; }
}

/* ===== SETUP ===== */
#setup {
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background: radial-gradient(ellipse at 30% 20%, rgba(245,166,35,0.06), transparent 70%);
}
.setup-card {
  width:100%;
  max-width:400px;
  background:var(--bg-secondary);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.setup-head {
  padding:28px 30px 16px;
  border-bottom:1px solid var(--border-color);
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-mark {
  width:10px; height:10px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px rgba(245,166,35,0.2);
  animation:pulse 1.8s infinite ease-in-out;
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.brand h1 { font-size:22px; font-weight:700; letter-spacing:0.5px; }
.setup-head p { color:var(--text-secondary); font-size:13px; margin-top:6px; line-height:1.5; }
.field { margin-bottom:16px; }
.field label {
  display:block;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:var(--text-secondary);
  margin-bottom:6px;
}
.field input {
  width:100%;
  background:var(--bg-primary);
  border:1px solid var(--border-color);
  color:var(--text-primary);
  padding:10px 14px;
  border-radius:8px;
  font-size:14px;
  transition:border-color 0.2s;
}
.field input:focus { border-color:var(--accent-dim); }
.btn {
  width:100%;
  background:var(--accent);
  color:#0A0D10;
  border:none;
  padding:12px;
  border-radius:8px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  transition:filter 0.2s, transform 0.1s;
}
.btn:hover { filter:brightness(1.08); }
.btn:active { transform:scale(0.98); }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.loading-line {
  display:none;
  align-items:center;
  gap:10px;
  margin-top:14px;
  font-size:12px;
  color:var(--text-secondary);
}
.spinner {
  width:14px; height:14px;
  border:2px solid var(--border-color);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.7s linear infinite;
}
@keyframes spin { to{ transform:rotate(360deg); } }
.error-box {
  margin-top:14px;
  font-size:13px;
  color:#FF6B6B;
  background:rgba(255,107,107,0.08);
  border:1px solid rgba(255,107,107,0.25);
  border-radius:8px;
  padding:10px 12px;
  display:none;
}
.saved-profiles {
  padding:16px 30px 0;
}
.saved-profiles-title {
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--text-muted);
  margin-bottom:10px;
}
.profile-card {
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--bg-primary);
  border:1px solid var(--border-color);
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:8px;
  cursor:pointer;
}
.profile-card:hover { border-color:var(--accent-dim); }
.profile-icon {
  width:34px; height:34px;
  border-radius:8px;
  background:var(--bg-card);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  color:var(--accent);
}
.profile-info { flex:1; min-width:0; }
.profile-name { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.profile-sub { font-size:11px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.profile-use-btn {
  background:var(--accent);
  color:#0A0D10;
  border:none;
  padding:5px 14px;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}
.profile-delete-btn {
  background:none;
  border:1px solid var(--border-color);
  color:var(--text-muted);
  width:30px; height:30px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
}
.profile-delete-btn:hover { color:#FF6B6B; border-color:#FF6B6B; }
.saved-profiles-sep {
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--text-muted);
  font-size:10px;
  text-transform:uppercase;
  margin:14px 0 0;
  letter-spacing:1px;
}
.saved-profiles-sep::before, .saved-profiles-sep::after { content:''; flex:1; height:1px; background:var(--border-color); }

/* ===== APP SHELL ===== */
#app {
  display:none;
  height:100vh;
  grid-template-columns:240px 1fr;
  grid-template-rows:56px auto 1fr;
  padding: 1.6vh 1.8vw;
  background: var(--bg-primary);
}
#app.show { display:grid; }

.topbar {
  grid-column:1 / 3;
  grid-row:1;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:var(--bg-secondary);
  border-bottom:1px solid var(--border-color);
  gap:16px;
}
.topbar .brand h1 { font-size:16px; }
.topbar .brand-mark { width:8px; height:8px; }
.search-wrap {
  flex:1;
  max-width:380px;
  position:relative;
}
.search-wrap input {
  width:100%;
  background:var(--bg-primary);
  border:1px solid var(--border-color);
  color:var(--text-primary);
  padding:6px 12px 6px 32px;
  border-radius:20px;
  font-size:13px;
}
.search-wrap input:focus { border-color:var(--accent-dim); }
.search-icon {
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:var(--text-muted);
  font-size:13px;
}
.top-tabs {
  display:flex;
  gap:4px;
  margin-left:auto;
}
.top-tab {
  background:none;
  border:none;
  color:var(--text-secondary);
  font-size:12px;
  font-weight:600;
  padding:6px 14px;
  border-radius:18px;
  cursor:pointer;
  transition:background 0.15s, color 0.15s, transform 0.05s;
}
.top-tab.active { background:var(--accent-bg); color:var(--accent); }
.top-tab:hover:not(.active) { color:var(--text-primary); }

.conn-name {
  font-size:11px;
  color:var(--text-muted);
  border-left:1px solid var(--border-color);
  padding-left:14px;
  max-width:140px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.icon-btn {
  background:none;
  border:1px solid var(--border-color);
  color:var(--text-secondary);
  width:34px; height:34px;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:border-color 0.15s, color 0.15s, transform 0.05s;
}
.icon-btn:hover { border-color:var(--text-muted); color:var(--text-primary); }
.icon-btn:focus { transform:scale(1.12); }

.mobile-type-tabs {
  display:none;
  grid-column:1 / 3;
  grid-row:2;
  gap:8px;
  padding:10px 14px;
  overflow-x:auto;
  border-bottom:1px solid var(--border-color);
  background:var(--bg-secondary);
}
.mobile-type-tabs .top-tab { flex-shrink:0; }

.sidebar {
  grid-column:1;
  grid-row:3;
  background:var(--bg-secondary);
  border-right:1px solid var(--border-color);
  overflow-y:auto;
  padding:14px 0;
}
.sb-title {
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:0.8px;
  color:var(--text-muted);
  padding:0 18px 8px;
}
.cat-item {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 18px;
  cursor:pointer;
  font-size:13px;
  color:var(--text-secondary);
  border-left:2px solid transparent;
  transition:color 0.12s, background 0.12s, transform 0.05s;
}
.cat-item:hover { color:var(--text-primary); background:rgba(255,255,255,0.02); }
.cat-item.active { color:var(--accent); border-left-color:var(--accent); background:var(--accent-bg); }
.cat-count { font-size:10px; color:var(--text-muted); font-weight:600; }

.main {
  grid-column:2;
  grid-row:3;
  overflow-y:auto;
  padding:18px 22px 40px;
  scroll-behavior: auto;
}
.grid-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.grid-header h2 { font-size:18px; font-weight:600; }
.grid-count { font-size:12px; color:var(--text-muted); }

.channel-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:14px;
}
.channel-grid.poster-grid {
  grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:16px;
}
.chan-card {
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:12px;
  cursor:pointer;
  transition:transform 0.05s ease, border-color 0.05s ease, box-shadow 0.05s ease;
  will-change: transform;
  backface-visibility: hidden;
}
.chan-card:focus {
  transform: scale(1.03);
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
  outline: none;
}
.chan-card.playing { border-color:var(--accent); background:var(--accent-bg); }
.chan-logo-wrap {
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg-primary);
  border-radius:8px;
  overflow:hidden;
  position:relative;
}
.chan-logo-wrap img {
  max-width:100%; max-height:100%; object-fit:contain;
  width:100%; height:100%;
  decoding:async;
}
.chan-logo-fallback { font-size:18px; font-weight:700; color:var(--text-muted); }
.chan-name {
  font-size:13px;
  line-height:1.3;
  margin-top:8px;
  text-align:center;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.chan-meta {
  display:flex;
  justify-content:center;
  margin-top:4px;
  font-size:10px;
  color:var(--text-muted);
  font-weight:600;
}
.chan-card.poster {
  padding:0;
  border-radius:var(--radius);
  overflow:hidden;
  position:relative;
  transition:transform 0.05s ease, box-shadow 0.05s ease;
}
.chan-card.poster:focus {
  transform: scale(1.03);
  box-shadow: 0 0 0 2px var(--accent);
  outline: none;
}
.chan-card.poster .chan-logo-wrap {
  height:0;
  padding-bottom:150%;
  border-radius:0;
  position:relative;
  background:linear-gradient(160deg, var(--bg-card), var(--bg-primary));
  image-rendering: auto;
}
.chan-card.poster .chan-logo-wrap img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  decoding:async;
}
.chan-card.poster .chan-logo-wrap .chan-logo-fallback {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:700;
}
.chan-card.poster .chan-name {
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:24px 10px 10px;
  background:linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.5) 60%, transparent);
  font-size:13px;
  font-weight:600;
  text-align:left;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  margin:0;
  line-height:1.4;
  pointer-events:none;
}
.chan-card.poster .chan-meta { display:none; }
.fav-badge {
  position:absolute;
  top:8px;
  right:8px;
  z-index:6;
  width:30px;
  height:30px;
  border-radius:50%;
  border:none;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(4px);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  line-height:1;
  color:#fff;
  cursor:pointer;
  transition:transform 0.1s ease, background 0.15s ease, color 0.15s ease;
}
.fav-badge:hover, .fav-badge:focus {
  transform:scale(1.15);
  background:rgba(245,166,35,0.85);
  color:#0A0D10;
  outline:none;
}
.fav-badge.active {
  color:var(--accent);
  background:rgba(245,166,35,0.25);
}
.fav-badge-row {
  flex-shrink:0;
  width:30px;
  height:30px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.06);
  color:var(--text-secondary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  line-height:1;
  cursor:pointer;
  transition:transform 0.1s ease, background 0.15s ease, color 0.15s ease;
}
.fav-badge-row:hover, .fav-badge-row:focus {
  transform:scale(1.12);
  background:rgba(245,166,35,0.85);
  color:#0A0D10;
  outline:none;
}
.fav-badge-row.active {
  color:var(--accent);
  background:rgba(245,166,35,0.18);
}
.chan-logo-wrap img {
  opacity:0;
  transition:opacity 0.25s ease;
}
.chan-logo-wrap img.loaded {
  opacity:1;
}

.series-list { display:flex; flex-direction:column; gap:8px; }
.series-row {
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:10px 14px;
  cursor:pointer;
  transition:border-color 0.05s, transform 0.05s;
}
.series-row:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
  outline: none;
}
.series-row img {
  width:48px; height:68px;
  object-fit:cover;
  border-radius:6px;
  background:var(--bg-primary);
  decoding:async;
}
.series-row .info { flex:1; }
.series-row .info .t { font-size:14px; font-weight:500; }
.series-row .info .g { font-size:12px; color:var(--text-secondary); }
.ep-list { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
.ep-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  transition:border-color 0.05s, transform 0.05s;
}
.ep-row:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
  outline: none;
}
.back-link {
  color:var(--accent);
  font-size:13px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-bottom:16px;
}

.empty-state {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:60vh;
  color:var(--text-muted);
  text-align:center;
  gap:6px;
}
.empty-state .big { font-size:14px; color:var(--text-secondary); }

#my-lists-modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  z-index:55;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(4px);
}
#my-lists-modal.show { display:flex; }
.my-lists-box {
  width:min(440px, 92vw);
  max-height:80vh;
  background:var(--bg-secondary);
  border-radius:var(--radius);
  border:1px solid var(--border-color);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.my-lists-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 18px;
  border-bottom:1px solid var(--border-color);
  font-weight:600;
  font-size:16px;
}
.my-lists-body { padding:14px 18px; overflow-y:auto; }
.my-lists-body .profile-card:last-child { margin-bottom:0; }
.my-lists-foot { padding:14px 18px; border-top:1px solid var(--border-color); }
.my-lists-empty {
  color:var(--text-secondary);
  font-size:14px;
  text-align:center;
  padding:30px 10px;
}
.close-x {
  background:none;
  border:none;
  color:var(--text-secondary);
  font-size:20px;
  cursor:pointer;
  width:32px; height:32px;
  border-radius:8px;
  transition:background 0.12s;
}
.close-x:hover { background:var(--bg-card); color:var(--text-primary); }
.close-x:focus { outline:3px solid var(--accent); }

#player-overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  z-index:50;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
#player-overlay.show { display:flex; }
.player-box {
  width:min(1100px, 94vw);
  background:#000;
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--border-color);
  box-shadow:var(--shadow);
}
.player-topline {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
  background:var(--bg-secondary);
  border-bottom:1px solid var(--border-color);
}
.player-title {
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
}
.live-dot {
  width:8px; height:8px;
  border-radius:50%;
  background:#FF4757;

<script>
(function(){
"use strict";

// ===== LISTA DE SERVIDORES PERMITIDOS (ocultos) =====
const SERVIDORES = [
  'http://zonacero.lat:8080',
  'http://liontv.es:8080',
  'http://tv.proyectox.vip:8080',
  'http://neospaxy.top:8080'
];

// ===== STATE =====
let state = {
  mode: 'xtream',
  connName: '',
  channels: [],
  categories: [],
  activeCategory: 'all',
  activeType: 'live',
  xtream: null,
  vod: [],
  vodCategories: [],
  series: [],
  seriesCategories: [],
  seriesEpisodesCache: {},
  viewingSeries: null,
  hls: null,
  renderLimit: 60,
  currentPlaybackItem: null // { type: 'channel'|'vod'|'series', id, title, url, logo }
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

// ===== PERSISTENCE =====
const PROFILES_KEY = 'codigomaster_profiles';
const HISTORY_KEY = 'codigomaster_history';
const FAVORITES_KEY = 'codigomaster_favorites';
const CONTINUE_KEY = 'codigomaster_continue';

function loadProfiles(){ try{ return JSON.parse(localStorage.getItem(PROFILES_KEY)) || []; }catch(e){ return []; } }
function saveProfiles(list){ try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(list)); }catch(e){} }

function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }catch(e){ return []; } }
function saveHistory(list){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }catch(e){} }

function loadFavorites(){ try{ return JSON.parse(localStorage.getItem(FAVORITES_KEY)) || []; }catch(e){ return []; } }
function saveFavorites(list){ try{ localStorage.setItem(FAVORITES_KEY, JSON.stringify(list)); }catch(e){} }

function loadContinue(){ try{ return JSON.parse(localStorage.getItem(CONTINUE_KEY)) || []; }catch(e){ return []; } }
function saveContinue(list){ try{ localStorage.setItem(CONTINUE_KEY, JSON.stringify(list)); }catch(e){} }

function addToHistory(title, url) {
  if (!title || !url) return;
  const history = loadHistory();
  const exists = history.some(item => item.title === title && item.url === url);
  if (!exists) {
    history.unshift({ title, url, timestamp: Date.now() });
    if (history.length > 100) history.pop();
    saveHistory(history);
  } else {
    const idx = history.findIndex(item => item.title === title && item.url === url);
    if (idx > 0) {
      const item = history.splice(idx, 1)[0];
      item.timestamp = Date.now();
      history.unshift(item);
      saveHistory(history);
    }
  }
}

function clearHistory() {
  if (confirm('¿Eliminar todo el historial de reproducción?')) {
    saveHistory([]);
    renderMain();
  }
}

// ===== FAVORITOS =====
function toggleFavorite(item) {
  if (!item || !item.id) return;
  const favs = loadFavorites();
  const exists = favs.some(f => f.id === item.id && f.type === item.type);
  if (exists) {
    saveFavorites(favs.filter(f => !(f.id === item.id && f.type === item.type)));
  } else {
    favs.push({ id: item.id, type: item.type, title: item.title, url: item.url, logo: item.logo || '' });
    saveFavorites(favs);
  }
  if (state.activeType === 'favorites') renderMain();
  // Actualizar el botón de favoritos en el menú si está abierto
  const favBtn = document.querySelector('.quality-menu button[data-action="favorite"]');
  if (favBtn) updateFavMenuButton(favBtn);
}

function isFavorite(item) {
  if (!item || !item.id) return false;
  const favs = loadFavorites();
  return favs.some(f => f.id === item.id && f.type === item.type);
}

function updateFavMenuButton(btn) {
  const item = state.currentPlaybackItem;
  if (!item || !item.id) {
    btn.textContent = '☆ Favorito';
    btn.classList.remove('active-quality');
    return;
  }
  const isFav = isFavorite(item);
  btn.textContent = isFav ? '⭐ Quitar favorito' : '☆ Añadir favorito';
  btn.classList.toggle('active-quality', isFav);
}

// ===== CONTINUAR VIENDO =====
function updateContinueWatching(item, currentTime, duration) {
  if (!item || !item.id || !item.url) return;
  const list = loadContinue();
  const existing = list.find(i => i.id === item.id && i.type === item.type);
  const entry = {
    id: item.id,
    type: item.type,
    title: item.title,
    url: item.url,
    logo: item.logo || '',
    currentTime: Math.floor(currentTime),
    duration: Math.floor(duration || 0),
    timestamp: Date.now()
  };
  if (existing) {
    Object.assign(existing, entry);
  } else {
    list.push(entry);
  }
  saveContinue(list);
}

function getContinueItems() {
  return loadContinue().sort((a,b) => b.timestamp - a.timestamp);
}

function renderContinueWatching(main, beforeHtml) {
  const items = getContinueItems().filter(i => i.currentTime > 5 && i.currentTime < i.duration - 5);
  if (items.length === 0) return beforeHtml;
  
  let html = `<div class="continue-watching-section">`;
  html += `<div class="grid-header"><h2>▶ Continuar viendo</h2><span class="grid-count">${items.length}</span></div>`;
  html += `<div class="series-list">`;
  items.forEach(item => {
    const progress = item.duration > 0 ? Math.min(100, (item.currentTime / item.duration) * 100) : 0;
    const typeLabel = { channel: '📺', vod: '🎬', series: '📺' }[item.type] || '▶';
    html += `<div class="continue-item" data-id="${escapeAttr(item.id)}" data-type="${escapeAttr(item.type)}">
      <div class="poster-mini">${item.logo ? `<img loading="lazy" src="${escapeAttr(item.logo)}" decoding="async" onerror="this.style.display='none'">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);">${typeLabel}</div>`}</div>
      <div class="info">
        <div class="t">${escapeHtml(item.title)}</div>
        <div class="g">${typeLabel} ${Math.floor(item.currentTime/60)}:${String(Math.floor(item.currentTime%60)).padStart(2,'0')} / ${Math.floor(item.duration/60)}:${String(Math.floor(item.duration%60)).padStart(2,'0')}</div>
        <div class="progress-bar"><div class="fill" style="width:${progress}%;"></div></div>
      </div>
      <button class="resume-btn" data-id="${escapeAttr(item.id)}" data-type="${escapeAttr(item.type)}">Reanudar</button>
    </div>`;
  });
  html += `</div></div>`;
  return beforeHtml + html;
}

// ===== FUNCIONES DE PERFIL (sin cambios) =====
function profileKeyOf(p){ return 'xtream:' + p.xtream.server + ':' + p.xtream.user; }
function defaultProfileName(p){ return p.xtream.user; }
function upsertProfile(profile, customName){
  const list = loadProfiles();
  const key = profileKeyOf(profile);
  const existing = list.find(p => profileKeyOf(p) === key);
  const name = customName || (existing && existing.name) || profile.xtream.user;
  const entry = Object.assign({}, profile, { name, lastUsed: Date.now(), id: (existing && existing.id) || (Date.now()+''+Math.random().toString(36).slice(2,7)) });
  saveProfiles(list.filter(p => profileKeyOf(p) !== key).concat(entry));
}
function deleteProfile(id){ saveProfiles(loadProfiles().filter(p => p.id !== id)); renderSavedProfiles(); }
function mostRecentProfile(){ const list = loadProfiles(); if(!list.length) return null; return list.sort((a,b)=> (b.lastUsed||0) - (a.lastUsed||0))[0]; }

function profileCardsHtml(list, currentKey){
  if(!list.length) return '';
  let html = '';
  list.forEach(p=>{
    const sub = p.xtream.user;
    const icon = '👤';
    const isCurrent = currentKey && profileKeyOf(p) === currentKey;
    html += `<div class="profile-card" data-id="${escapeAttr(p.id)}">
      <div class="profile-icon">${icon}</div>
      <div class="profile-info">
        <div class="profile-name">${escapeHtml(p.name)}${isCurrent ? ' <span style="color:var(--accent);font-size:10px;">●</span>' : ''}</div>
        <div class="profile-sub">${escapeHtml(sub)}</div>
      </div>
      ${isCurrent ? '' : `<button class="profile-use-btn" data-use="${escapeAttr(p.id)}">Usar</button>`}
      <button class="profile-delete-btn" data-del="${escapeAttr(p.id)}">🗑</button>
    </div>`;
  });
  return html;
}
function renderSavedProfiles(){
  const box = $('#saved-profiles');
  const list = loadProfiles().sort((a,b)=> (b.lastUsed||0) - (a.lastUsed||0));
  if(!list.length){ box.style.display = 'none'; box.innerHTML = ''; return; }
  let html = `<div class="saved-profiles-title">Tus cuentas guardadas</div>`;
  html += profileCardsHtml(list, currentProfileKey());
  html += `<div class="saved-profiles-sep">o agrega una nueva</div>`;
  box.innerHTML = html;
  box.style.display = 'block';
  box.querySelectorAll('[data-use]').forEach(b=> b.addEventListener('click', ()=> useProfile(b.dataset.use)));
  box.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', (e)=>{ e.stopPropagation(); deleteProfile(b.dataset.del); }));
}
function currentProfileKey(){
  if(!state.xtream) return null;
  return profileKeyOf({ mode:'xtream', xtream:{ server: state.xtream.base, user: state.xtream.user } });
}
function renderMyListsModal(){
  const body = $('#my-lists-body');
  const list = loadProfiles().sort((a,b)=> (b.lastUsed||0) - (a.lastUsed||0));
  if(!list.length){ body.innerHTML = `<div class="my-lists-empty">Aún no tienes cuentas guardadas.</div>`; return; }
  body.innerHTML = profileCardsHtml(list, currentProfileKey());
  body.querySelectorAll('[data-use]').forEach(b=> b.addEventListener('click', async ()=>{ closeMyListsModal(); await useProfile(b.dataset.use); }));
  body.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', (e)=>{ e.stopPropagation(); deleteProfile(b.dataset.del); renderMyListsModal(); }));
}
function openMyListsModal(){ renderMyListsModal(); $('#my-lists-modal').classList.add('show'); }
function closeMyListsModal(){ $('#my-lists-modal').classList.remove('show'); }

// ===== EVENT LISTENERS =====
$('#my-lists-btn').addEventListener('click', openMyListsModal);
$('#my-lists-close').addEventListener('click', closeMyListsModal);
$('#my-lists-modal').addEventListener('click', e=>{ if(e.target.id === 'my-lists-modal') closeMyListsModal(); });
$('#my-lists-add-btn').addEventListener('click', ()=>{ closeMyListsModal(); $('#disconnect-btn').click(); });

$('#hamburger-btn').addEventListener('click', ()=>{ $('#sidebar').classList.toggle('open'); $('#sidebar-scrim').classList.toggle('show'); });
$('#sidebar-scrim').addEventListener('click', ()=>{ $('#sidebar').classList.remove('open'); $('#sidebar-scrim').classList.remove('show'); });

$('#x-load-btn').addEventListener('click', ()=> connectXtream());
$('#disconnect-btn').addEventListener('click', disconnectApp);
$('#player-close').addEventListener('click', closePlayer);
$('#player-close').addEventListener('keydown', function(e){ const kc = e.keyCode || e.which; if(e.key === 'Enter' || e.key === ' ' || kc === 13 || kc === 23 || kc === 32 || kc === 66) { e.preventDefault(); closePlayer(); } });

// ===== HELPERS =====
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }
function makeActivatable(el, handler){
  el.setAttribute('tabindex','0');
  el.setAttribute('role','button');
  el.addEventListener('click', handler);
  el.addEventListener('keydown', e=>{
    const kc = e.keyCode || e.which;
    if (e.key === 'Enter' || e.key === ' ' || kc === 13 || kc === 23 || kc === 32 || kc === 66) {
      e.preventDefault();
      e.stopPropagation();
      handler();
    }
  });
}

// ===== XTREAM =====
async function xtreamApi(base, user, pass, action, extra){ 
  const url = `${base}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}${action ? '&action='+action : ''}${extra||''}`; 
  const res = await fetch(url); 
  if(!res.ok) throw new Error('HTTP '+res.status); 
  return res.json(); 
}

async function useProfile(id){
  const p = loadProfiles().find(x => x.id === id);
  if(!p) return;
  if(p.mode === 'xtream' && p.xtream) {
    await connectXtream({ server: p.xtream.server, user: p.xtream.user, pass: p.xtream.pass, name: p.name });
  } else {
    alert('Esta versión solo soporta cuentas Xtream.');
  }
}

async function connectXtream(opts){
  opts = opts || {};
  let base = opts.server || SERVIDORES[0];
  if(!SERVIDORES.includes(base)){
    $('#x-error').textContent = 'Servidor no autorizado.';
    $('#x-error').style.display = 'block';
    return false;
  }
  const user = opts.user !== undefined ? opts.user : $('#x-user').value.trim();
  const pass = opts.pass !== undefined ? opts.pass : $('#x-pass').value;
  const customName = opts.name !== undefined ? opts.name : undefined;
  const errBox = $('#x-error');
  const loading = $('#x-loading');
  errBox.style.display = 'none';
  if(!user || !pass){ errBox.textContent = 'Ingresa usuario y contraseña.'; errBox.style.display = 'block'; return false; }
  loading.style.display = 'flex';
  
  let serversToTry = opts.server ? [opts.server] : SERVIDORES;
  
  for (let baseTry of serversToTry) {
    try {
      const auth = await xtreamApi(baseTry, user, pass);
      
      let isValid = false;
      let userInfo = null;
      
      if (auth && auth.user_info && auth.user_info.auth === 1) {
        isValid = true;
        userInfo = auth.user_info;
      }
      else if (auth && auth.auth === 1) {
        isValid = true;
        userInfo = auth.user_info || auth;
      }
      else if (auth && auth.user_info && auth.user_info.username) {
        isValid = true;
        userInfo = auth.user_info;
      }
      else if (auth && auth.user_info) {
        isValid = true;
        userInfo = auth.user_info;
      }
      else if (auth && typeof auth === 'object' && auth.username) {
        isValid = true;
        userInfo = auth;
      }
      
      if (!isValid) {
        throw new Error('Credenciales inválidas o respuesta inesperada');
      }
      
      const liveCats = await xtreamApi(baseTry, user, pass, 'get_live_categories').catch(()=>[]);
      const liveStreams = await xtreamApi(baseTry, user, pass, 'get_live_streams').catch(()=>[]);
      const vodCats = await xtreamApi(baseTry, user, pass, 'get_vod_categories').catch(()=>[]);
      const vodStreams = await xtreamApi(baseTry, user, pass, 'get_vod_streams').catch(()=>[]);
      const seriesCats = await xtreamApi(baseTry, user, pass, 'get_series_categories').catch(()=>[]);
      const seriesList = await xtreamApi(baseTry, user, pass, 'get_series').catch(()=>[]);

      const catNameById = {}; liveCats.forEach(c=> catNameById[c.category_id] = c.category_name);
      const channels = liveStreams.map(s=>({ 
        id: 'channel_' + s.stream_id, 
        name: s.name, 
        logo: s.stream_icon || '', 
        group: catNameById[s.category_id] || 'General', 
        catId: s.category_id, 
        streamId: s.stream_id, 
        url: `${baseTry}/live/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${s.stream_id}.m3u8`,
        type: 'channel'
      }));

      const vodCatNameById = {}; vodCats.forEach(c=> vodCatNameById[c.category_id] = c.category_name);
      const vod = vodStreams.map(s=>({ 
        id: 'vod_' + s.stream_id, 
        name: s.name, 
        logo: s.stream_icon || '', 
        group: vodCatNameById[s.category_id] || 'General', 
        catId: s.category_id, 
        streamId: s.stream_id, 
        url: `${baseTry}/movie/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${s.stream_id}.${s.container_extension || 'mp4'}`,
        type: 'vod'
      }));

      const seriesCatNameById = {}; seriesCats.forEach(c=> seriesCatNameById[c.category_id] = c.category_name);
      const series = seriesList.map(s=>({ 
        id: 'series_' + s.series_id, 
        name: s.name, 
        logo: s.cover || '', 
        group: seriesCatNameById[s.category_id] || 'General', 
        catId: s.category_id, 
        seriesId: s.series_id,
        type: 'series',
        url: '' // se genera al reproducir un episodio
      }));

      state.mode = 'xtream';
      state.xtream = { base: baseTry, user, pass };
      
      let expDateRaw = null;
      if (userInfo) {
        if (userInfo.exp_date) expDateRaw = userInfo.exp_date;
        else if (userInfo.expiration_date) expDateRaw = userInfo.expiration_date;
        else if (userInfo.expire_date) expDateRaw = userInfo.expire_date;
        else if (userInfo.expiry_date) expDateRaw = userInfo.expiry_date;
      }
      if (!expDateRaw && auth) {
        if (auth.exp_date) expDateRaw = auth.exp_date;
        else if (auth.expiration_date) expDateRaw = auth.expiration_date;
        else if (auth.expire_date) expDateRaw = auth.expire_date;
        else if (auth.expiry_date) expDateRaw = auth.expiry_date;
      }
      let formattedDate = 'Ilimitado';
      if (expDateRaw && parseInt(expDateRaw) > 0) {
        const d = new Date(parseInt(expDateRaw) * 1000);
        formattedDate = d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
      }
      state.connName = user + ' | ' + formattedDate;

      state.channels = channels;
      state.categories = buildCategoriesFromChannels(channels);
      state.vod = vod;
      state.vodCategories = buildCategoriesFromChannels(vod);
      state.series = series;
      state.seriesCategories = buildCategoriesFromChannels(series);
      loading.style.display = 'none';
      upsertProfile({ mode: 'xtream', xtream: { server: baseTry, user, pass } }, customName);
      launchApp();
      return true;
    } catch(e) {
      // Continuar con el siguiente servidor
    }
  }
  
  loading.style.display = 'none';
  errBox.textContent = 'Error: No se pudo conectar con ningún servidor. Verifica tus credenciales.';
  errBox.style.display = 'block';
  return false;
}

function buildCategoriesFromChannels(channels){
  const map = {};
  channels.forEach(c=>{ const g = c.group || 'General'; map[g] = (map[g]||0)+1; });
  return Object.keys(map).sort((a,b)=>a.localeCompare(b)).map(name=>({id:name, name, count:map[name]}));
}

// ===== MANEJO DE BOTONES DEL MANDO =====
function ensureFocus() {
  const active = document.activeElement;
  if (!active || active === document.body || !document.body.contains(active)) {
    const main = document.getElementById('main');
    const first = (main && main.querySelector('[tabindex="0"]:not([tabindex="-1"])')) ||
                  document.querySelector('[tabindex="0"]:not([tabindex="-1"])') ||
                  document.querySelector('.top-tab') ||
                  document.querySelector('.cat-item');
    if (first) first.focus();
  }
}

function setupKeyListeners() {
  // Evita adjuntar el listener más de una vez si launchApp() se llama de nuevo
  // (por ejemplo al reconectar), lo que causaría doble ejecución de cada tecla.
  if (setupKeyListeners._attached) return;
  setupKeyListeners._attached = true;

  const handler = function(e) {
    let key = e.key;
    const keyCode = e.keyCode || e.which;
    const type = e.type;
    if (type !== 'keydown') return;

    // Alias para navegadores de Smart TV antiguos (algunas versiones de Tizen/webOS
    // reportan 'Up'/'Down'/'Left'/'Right' en vez del estándar 'ArrowUp' etc.)
    const legacyDirMap = { Up:'ArrowUp', Down:'ArrowDown', Left:'ArrowLeft', Right:'ArrowRight' };
    if (legacyDirMap[key]) key = legacyDirMap[key];

    // Si el foco está en un campo de texto (buscador, usuario/contraseña, etc.),
    // dejamos que el teclado/control funcione de forma nativa (Backspace, flechas
    // para mover el cursor, Enter, etc.) y solo interceptamos la tecla física de
    // Atrás/Exit del mando para poder salir del campo.
    const activeEl = document.activeElement;
    const activeTag = activeEl ? activeEl.tagName : '';
    const isEditable = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || (activeEl && activeEl.isContentEditable);

    // Detección amplia de "Atrás/Exit" para cubrir mandos de TV box, Android TV,
    // Samsung Tizen, LG webOS y teclados genéricos. Backspace (8) se excluye
    // aparte más abajo para no romper la edición de texto.
    const isBackKeyStrict = (
      key === 'Escape' || key === 'Back' || key === 'GoBack' || key === 'BrowserBack' ||
      key === 'Exit' || key === 'XF86Back' ||
      keyCode === 27 || keyCode === 4 || keyCode === 111 ||
      keyCode === 166 || keyCode === 10009 || keyCode === 461 || keyCode === 10182
    );
    const isBackKey = isBackKeyStrict || (!isEditable && keyCode === 8);

    if (isEditable) {
      // Solo permitimos que la tecla física de Atrás/Exit saque el foco del campo.
      if (isBackKeyStrict) {
        e.preventDefault();
        activeEl.blur();
      }
      return;
    }

    const playerOverlay = document.getElementById('player-overlay');
    const video = document.getElementById('video');

    if (playerOverlay && playerOverlay.classList.contains('show') && video) {
      if (key === 'Enter' || key === ' ' || key === 'OK' || key === 'Accept' || keyCode === 13 || keyCode === 23 || keyCode === 66 || keyCode === 32 || key === 'MediaPlayPause' || keyCode === 85) {
        e.preventDefault();
        if (video.paused) video.play(); else video.pause();
        return;
      }
      if (key === 'ArrowRight' || keyCode === 39 || keyCode === 22 || key === 'MediaNextTrack' || keyCode === 87) {
        e.preventDefault();
        video.currentTime += 10;
        return;
      }
      if (key === 'ArrowLeft' || keyCode === 37 || keyCode === 21 || key === 'MediaPreviousTrack' || keyCode === 88) {
        e.preventDefault();
        video.currentTime -= 10;
        return;
      }
      if (isBackKey) {
        e.preventDefault();
        closePlayer();
        return;
      }
      if (key === 'Menu' || keyCode === 82) {
        e.preventDefault();
        closePlayer();
        return;
      }
      return;
    }

    if ($('#my-lists-modal').classList.contains('show')) {
      if (isBackKey) {
        e.preventDefault();
        closeMyListsModal();
        return;
      }
      return;
    }

    if (key === 'ArrowUp' || keyCode === 38 || keyCode === 19) {
      e.preventDefault();
      navigateFocus('up');
      return;
    }
    if (key === 'ArrowDown' || keyCode === 40 || keyCode === 20) {
      e.preventDefault();
      navigateFocus('down');
      return;
    }
    if (key === 'ArrowLeft' || keyCode === 37 || keyCode === 21) {
      e.preventDefault();
      navigateFocus('left');
      return;
    }
    if (key === 'ArrowRight' || keyCode === 39 || keyCode === 22) {
      e.preventDefault();
      navigateFocus('right');
      return;
    }

    if (key === 'Enter' || key === ' ' || key === 'OK' || key === 'Accept' || keyCode === 13 || keyCode === 23 || keyCode === 66 || keyCode === 32) {
      e.preventDefault();
      const active = document.activeElement;
      if (active && active !== document.body && typeof active.click === 'function') {
        active.click();
      }
      return;
    }

    if (isBackKey) {
      e.preventDefault();
      window.history.back();
      return;
    }

    if ((key === 'Menu' || keyCode === 82) && !$('#my-lists-modal').classList.contains('show')) {
      e.preventDefault();
      openMyListsModal();
      return;
    }

    if (key === 'Search' || keyCode === 84) {
      e.preventDefault();
      const searchInput = document.getElementById('search-input');
      if (searchInput) searchInput.focus();
      return;
    }

    if (document.activeElement === document.body) {
      ensureFocus();
    }
  };

  document.addEventListener('keydown', handler);
  setInterval(ensureFocus, 2000);
  startGamepadSupport();
}

function navigateFocus(direction) {
  const focusables = Array.from(document.querySelectorAll('[tabindex="0"]:not([tabindex="-1"])'))
    .filter(el => {
      const r = el.getBoundingClientRect();
      return r.width > 0 && r.height > 0 && el.offsetParent !== null;
    });
  if (focusables.length === 0) return;

  const current = document.activeElement;
  if (!current || current === document.body || !focusables.includes(current)) {
    const first = focusables[0];
    first.focus();
    first.scrollIntoView({ block: 'center', behavior: 'auto' });
    return;
  }

  const curRect = current.getBoundingClientRect();
  const curCx = curRect.left + curRect.width / 2;
  const curCy = curRect.top + curRect.height / 2;

  let best = null;
  let bestGroup = 2;
  let bestScore = Infinity;
  for (const el of focusables) {
    if (el === current) continue;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    let primary, cross, valid, overlap;
    if (direction === 'up') {
      valid = r.bottom <= curRect.top + 1;
      primary = curCy - cy;
      cross = Math.abs(cx - curCx);
      overlap = Math.min(r.right, curRect.right) - Math.max(r.left, curRect.left);
    } else if (direction === 'down') {
      valid = r.top >= curRect.bottom - 1;
      primary = cy - curCy;
      cross = Math.abs(cx - curCx);
      overlap = Math.min(r.right, curRect.right) - Math.max(r.left, curRect.left);
    } else if (direction === 'left') {
      valid = r.right <= curRect.left + 1;
      primary = curCx - cx;
      cross = Math.abs(cy - curCy);
      overlap = Math.min(r.bottom, curRect.bottom) - Math.max(r.top, curRect.top);
    } else {
      valid = r.left >= curRect.right - 1;
      primary = cx - curCx;
      cross = Math.abs(cy - curCy);
      overlap = Math.min(r.bottom, curRect.bottom) - Math.max(r.top, curRect.top);
    }
    if (!valid) continue;
    const group = overlap > 0 ? 0 : 1;
    const score = cross * 3 + primary;
    if (group < bestGroup || (group === bestGroup && score < bestScore)) {
      bestGroup = group;
      bestScore = score;
      best = el;
    }
  }

  if (best) {
    best.focus();
    best.scrollIntoView({ block: 'center', behavior: 'auto' });
  }
}

// ===== SOPORTE ADICIONAL: MANDOS EXPUESTOS COMO GAMEPAD =====
// Algunos mandos de ciertos TV box / Smart TV no disparan eventos de teclado y en
// cambio se registran como un gamepad HID estándar. Aquí los traducimos a las
// mismas acciones de navegación, para que la app funcione igual sin importar cómo
// el dispositivo reporte sus botones.
let gamepadPollActive = false;
let gamepadPrevPressed = {};
function pollGamepads() {
  if (!gamepadPollActive) return;
  const pads = (navigator.getGamepads && navigator.getGamepads()) || [];
  for (const pad of pads) {
    if (!pad) continue;
    const id = pad.index;
    const prev = gamepadPrevPressed[id] || {};
    const isPressed = (i) => !!(pad.buttons[i] && (pad.buttons[i].pressed || pad.buttons[i].value > 0.5));
    const dpad = {
      up: isPressed(12) || (pad.axes[1] !== undefined && pad.axes[1] < -0.5),
      down: isPressed(13) || (pad.axes[1] !== undefined && pad.axes[1] > 0.5),
      left: isPressed(14) || (pad.axes[0] !== undefined && pad.axes[0] < -0.5),
      right: isPressed(15) || (pad.axes[0] !== undefined && pad.axes[0] > 0.5),
      ok: isPressed(0),
      back: isPressed(1)
    };
    const cur = {};
    Object.keys(dpad).forEach(k => {
      cur[k] = dpad[k];
      if (dpad[k] && !prev[k]) {
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        const isEditable = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable);
        if (isEditable && k !== 'back') { /* no interferir con la escritura */ }
        else if (k === 'up') navigateFocus('up');
        else if (k === 'down') navigateFocus('down');
        else if (k === 'left') navigateFocus('left');
        else if (k === 'right') navigateFocus('right');
        else if (k === 'ok') {
          const active = document.activeElement;
          if (active && active !== document.body && typeof active.click === 'function') active.click();
        } else if (k === 'back') {
          const playerOverlay = document.getElementById('player-overlay');
          if (playerOverlay && playerOverlay.classList.contains('show')) closePlayer();
          else if ($('#my-lists-modal').classList.contains('show')) closeMyListsModal();
          else if (document.activeElement && document.activeElement.isContentEditable) document.activeElement.blur();
          else if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) document.activeElement.blur();
          else window.history.back();
        }
      }
    });
    gamepadPrevPressed[id] = cur;
  }
  requestAnimationFrame(pollGamepads);
}
function startGamepadSupport() {
  if (gamepadPollActive) return;
  gamepadPollActive = true;
  window.addEventListener('gamepadconnected', () => { gamepadPrevPressed = {}; });
  window.addEventListener('gamepaddisconnected', () => { gamepadPrevPressed = {}; });
  requestAnimationFrame(pollGamepads);
}

  settingsBtn.textContent = '⚙️';
  settingsBtn.setAttribute('tabindex', '0');
  settingsBtn.setAttribute('role', 'button');
  settingsBtn.setAttribute('aria-label', 'Ajustes de reproducción');

  // ---- Menú de ajustes ----
  const menu = document.createElement('div');
  menu.className = 'quality-menu';
  menu.setAttribute('role', 'menu');

  // Sección Resolución
  const resSection = document.createElement('div');
  resSection.className = 'menu-section';
  const resTitle = document.createElement('div');
  resTitle.className = 'menu-section-title';
  resTitle.textContent = 'Resolución';
  resSection.appendChild(resTitle);

  if (hls && hls.levels && hls.levels.length > 0) {
    // Opción Automático
    const autoBtn = document.createElement('button');
    autoBtn.textContent = 'Automático';
    autoBtn.dataset.level = '-1';
    autoBtn.setAttribute('role', 'menuitem');
    if (hls.currentLevel === -1) autoBtn.classList.add('active-quality');
    autoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      hls.currentLevel = -1;
      updateMenuActive(menu, 'level', -1);
      closeMenu();
    });
    autoBtn.addEventListener('keydown', handleMenuKeydown);
    resSection.appendChild(autoBtn);

    // Opciones de niveles
    hls.levels.forEach((level, index) => {
      const label = level.height ? `${level.height}p` : `Nivel ${index}`;
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.dataset.level = index;
      btn.setAttribute('role', 'menuitem');
      if (hls.currentLevel === index) btn.classList.add('active-quality');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        hls.currentLevel = index;
        updateMenuActive(menu, 'level', index);
        closeMenu();
      });
      btn.addEventListener('keydown', handleMenuKeydown);
      resSection.appendChild(btn);
    });
  } else {
    const infoBtn = document.createElement('button');
    infoBtn.textContent = 'No disponible';
    infoBtn.disabled = true;
    infoBtn.style.opacity = '0.5';
    infoBtn.style.cursor = 'default';
    resSection.appendChild(infoBtn);
  }

  menu.appendChild(resSection);

  // Sección Escalado
  const scaleSection = document.createElement('div');
  scaleSection.className = 'menu-section';
  const scaleTitle = document.createElement('div');
  scaleTitle.className = 'menu-section-title';
  scaleTitle.textContent = 'Escalado';
  scaleSection.appendChild(scaleTitle);

  const scaleOptions = [
    { value: 'none', label: 'Original' },
    { value: 'contain', label: 'Ajustar' },
    { value: 'cover', label: 'Rellenar' },
    { value: 'fill', label: 'Estirar' }
  ];

  scaleOptions.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt.label;
    btn.dataset.scale = opt.value;
    btn.setAttribute('role', 'menuitem');
    if (currentScale === opt.value) btn.classList.add('active-quality');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentScale = opt.value;
      video.style.objectFit = opt.value;
      updateMenuActive(menu, 'scale', opt.value);
      closeMenu();
    });
    btn.addEventListener('keydown', handleMenuKeydown);
    scaleSection.appendChild(btn);
  });

  menu.appendChild(scaleSection);

  // Sección Favoritos
  const favSection = document.createElement('div');
  favSection.className = 'menu-section';
  const favTitle = document.createElement('div');
  favTitle.className = 'menu-section-title';
  favTitle.textContent = 'Favoritos';
  favSection.appendChild(favTitle);

  const favBtn = document.createElement('button');
  favBtn.dataset.action = 'favorite';
  favBtn.setAttribute('role', 'menuitem');
  updateFavMenuButton(favBtn);
  favBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.currentPlaybackItem) {
      toggleFavorite(state.currentPlaybackItem);
      updateFavMenuButton(favBtn);
      closeMenu();
    }
  });
  favBtn.addEventListener('keydown', handleMenuKeydown);
  favSection.appendChild(favBtn);
  menu.appendChild(favSection);

  // Funciones auxiliares del menú
  function closeMenu() {
    menu.classList.remove('show');
    qualityMenuOpen = false;
  }

  function updateMenuActive(menu, type, value) {
    const buttons = menu.querySelectorAll('button');
    buttons.forEach(b => {
      if (type === 'level') {
        const level = parseInt(b.dataset.level);
        b.classList.toggle('active-quality', level === value);
      } else if (type === 'scale') {
        b.classList.toggle('active-quality', b.dataset.scale === value);
      }
    });
  }

  function handleMenuKeydown(e) {
    const kc = e.keyCode || e.which;
    if (e.key === 'Enter' || e.key === ' ' || kc === 13 || kc === 23 || kc === 32 || kc === 66) {
      e.preventDefault();
      e.stopPropagation();
      // El click ya maneja la acción
    }
    if (e.key === 'ArrowDown' || kc === 40 || kc === 20) {
      e.preventDefault();
      const items = Array.from(menu.querySelectorAll('button'));
      const idx = items.indexOf(e.target);
      if (idx < items.length - 1) items[idx + 1].focus();
    }
    if (e.key === 'ArrowUp' || kc === 38 || kc === 19) {
      e.preventDefault();
      const items = Array.from(menu.querySelectorAll('button'));
      const idx = items.indexOf(e.target);
      if (idx > 0) items[idx - 1].focus();
    }
    if (e.key === 'Escape' || kc === 27) {
      e.preventDefault();
      closeMenu();
      settingsBtn.focus();
    }
  }

  // Alternar menú al hacer clic en el botón
  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    qualityMenuOpen = !qualityMenuOpen;
    menu.classList.toggle('show', qualityMenuOpen);
    if (qualityMenuOpen) {
      // Actualizar el botón de favoritos al abrir el menú
      const favBtn = menu.querySelector('button[data-action="favorite"]');
      if (favBtn) updateFavMenuButton(favBtn);
      const firstItem = menu.querySelector('button');
      if (firstItem) firstItem.focus();
    }
  });

  settingsBtn.addEventListener('keydown', (e) => {
    const kc = e.keyCode || e.which;
    if (e.key === 'Enter' || e.key === ' ' || kc === 13 || kc === 23 || kc === 32 || kc === 66) {
      e.preventDefault();
      e.stopPropagation();
      qualityMenuOpen = !qualityMenuOpen;
      menu.classList.toggle('show', qualityMenuOpen);
      if (qualityMenuOpen) {
        const favBtn = menu.querySelector('button[data-action="favorite"]');
        if (favBtn) updateFavMenuButton(favBtn);
        const firstItem = menu.querySelector('button');
        if (firstItem) firstItem.focus();
      }
    }
  });

  // Cerrar menú al hacer clic fuera
  document.addEventListener('click', (e) => {
    if (qualityMenuOpen && !menu.contains(e.target) && !settingsBtn.contains(e.target)) {
      closeMenu();
    }
  });

  // Agregar al player
  playerBox.style.position = 'relative';
  playerBox.appendChild(settingsBtn);
  playerBox.appendChild(menu);
  qualityBtn = settingsBtn;
  qualityMenu = menu;

  // Inicializar el escalado por defecto (si no se ha establecido)
  if (!video.style.objectFit || video.style.objectFit === '') {
    video.style.objectFit = 'contain';
    currentScale = 'contain';
  }
}

// ===== PLAYER =====
const video = $('#video');
const extBtn = $('#ext-player-btn');
let continueUpdateInterval = null;
let playbackWatchdog = null;
let watchdogStallTicks = 0;
let watchdogLastTime = -1;

// Revisa la transmisión cada 3s. Si en ese lapso el video no avanzó (pantalla
// congelada / "display"), primero intenta una recuperación suave (sin cortar la
// imagen) y, si en el siguiente chequeo de 3s sigue trabado, fuerza una
// reconexión completa del stream para que el canal no se quede pegado ni se corte.
function stopPlaybackWatchdog(){
  if (playbackWatchdog) { clearInterval(playbackWatchdog); playbackWatchdog = null; }
  watchdogStallTicks = 0;
  watchdogLastTime = -1;
}
function startPlaybackWatchdog(streamUrl){
  stopPlaybackWatchdog();
  playbackWatchdog = setInterval(() => {
    const overlay = $('#player-overlay');
    if (!overlay || !overlay.classList.contains('show')) { stopPlaybackWatchdog(); return; }
    if (!video || video.paused || video.ended || video.seeking) { watchdogStallTicks = 0; watchdogLastTime = video ? video.currentTime : -1; return; }
    const t = video.currentTime;
    if (t === watchdogLastTime) {
      watchdogStallTicks++;
      const st = $('#player-status');
      if (watchdogStallTicks === 1) {
        // Primer chequeo trabado (~3s sin avanzar): recuperación suave, sin
        // reiniciar el manifiesto, para evitar un corte visible innecesario.
        if (st) st.textContent = 'Recuperando señal…';
        if (state.hls) {
          state.hls.startLoad();
        } else if (video) {
          video.play().catch(()=>{});
        }
      } else if (watchdogStallTicks >= 2) {
        // Sigue trabado ~6s después: reconexión completa del stream.
        watchdogStallTicks = 0;
        if (st) st.textContent = 'Reconectando…';
        if (state.hls) {
          state.hls.stopLoad();
          state.hls.loadSource(streamUrl);
          state.hls.attachMedia(video);
        } else if (video) {
          video.src = streamUrl;
          video.load();
          video.play().catch(()=>{});
        }
      }
    } else {
      watchdogStallTicks = 0;
    }
    watchdogLastTime = t;
  }, 3000);
}

function saveExactProgress() {
  if (video.duration > 0 && video.currentTime > 0 && state.currentPlaybackItem) {
    updateContinueWatching(state.currentPlaybackItem, video.currentTime, video.duration);
  }
}
video.addEventListener('pause', saveExactProgress);
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState === 'hidden') saveExactProgress(); });

function openInExternalPlayer(url, title){
  if(window.AndroidBridge && typeof window.AndroidBridge.openExternal === 'function'){ window.AndroidBridge.openExternal(url, title); }
  else { window.open(url, '_blank'); }
}
function playStream(url, title, resumeTime = 0, item = null){
  // Guardar el item actual para favoritos y continuar viendo
  if (item) {
    state.currentPlaybackItem = { 
      id: item.id || 'temp_' + Date.now(), 
      type: item.type || 'channel', 
      title: title, 
      url: url, 
      logo: item.logo || '' 
    };
  } else {
    // Intentar encontrar el item en los datasets
    state.currentPlaybackItem = { 
      id: 'temp_' + Date.now(), 
      type: 'channel', 
      title: title, 
      url: url, 
      logo: '' 
    };
  }
  
  addToHistory(title, url);
  
  if(window.AndroidBridge && typeof window.AndroidBridge.playNative === 'function'){ 
    window.AndroidBridge.playNative(url, title); 
    return; 
  }
  $('#player-overlay').classList.add('show');
  $('#player-title-text').textContent = title;
  const status = $('#player-status');
  status.classList.remove('err');
  extBtn.classList.remove('show');
  extBtn.onclick = ()=> openInExternalPlayer(url, title);
  if(state.hls){ state.hls.destroy(); state.hls = null; }
  video.pause(); video.removeAttribute('src'); video.preload = 'auto'; video.load();
  
  // Limpiar intervalo anterior
  if (continueUpdateInterval) {
    clearInterval(continueUpdateInterval);
    continueUpdateInterval = null;
  }
  stopPlaybackWatchdog();
  
  const isM3U8 = /\.m3u8($|\?)/i.test(url);
  if(isM3U8 && window.Hls && Hls.isSupported()){
    status.textContent = 'Conectando…';
    
    let reloadAttempts = 0;
    const MAX_RELOAD_ATTEMPTS = 5;
    
    const hls = new Hls({
      maxBufferLength: 40,
      maxMaxBufferLength: 60,
      maxBufferSize: 60 * 1024 * 1024,
      liveDurationInfinity: true,
      liveSyncDuration: 25,
      liveMaxLatencyDuration: 45,
      backbufferLength: 30,
      recoverAttempts: 10,
      enableWorker: true,
      lowLatencyMode: false,
      autoLevelCapping: -1,
      capLevelToPlayerSize: true,
      testBandwidth: false,
      startFragPrefetch: true,
      manifestLoadTimeout: 8000,
      levelLoadingTimeout: 8000,
      fragLoadingTimeout: 8000,
      startLevel: -1
    });
    
    state.hls = hls;
    hls.loadSource(url);
    hls.attachMedia(video);
    
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
      status.textContent = 'Reproduciendo en vivo';
      video.play().catch(()=>{});
      const playerBox = document.querySelector('.player-box');
      if (playerBox) {
        createPlayerControls(hls, playerBox);
      }
      // Si hay tiempo de reanudación, aplicarlo
      if (resumeTime > 0) {
        video.currentTime = resumeTime;
      }
      // Iniciar guardado de progreso
      startContinueWatching();
      // Vigilar cada 3s que el video siga avanzando; si se congela, reconectar
      startPlaybackWatchdog(url);
    });
    
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (data.fatal) {
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR ||
            data.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR ||
            data.details === Hls.ErrorDetails.LEVEL_LOAD_ERROR ||
            data.details === Hls.ErrorDetails.FRAG_LOAD_ERROR) {
          if (reloadAttempts < MAX_RELOAD_ATTEMPTS) {
            reloadAttempts++;
            status.textContent = `Reintentando (${reloadAttempts}/${MAX_RELOAD_ATTEMPTS})...`;
            setTimeout(() => {
              if (state.hls) {
                state.hls.loadSource(url);
                state.hls.attachMedia(video);
              }
            }, 1000);
            return;
          } else {
            status.classList.add('err');
            status.textContent = 'Error: No se pudo cargar el stream.';
            extBtn.classList.add('show');
            return;
          }
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          status.textContent = 'Recuperando error de medios...';
          hls.recoverMediaError();
          return;
        }
        status.classList.add('err');
        status.textContent = 'Error de reproducción';
        extBtn.classList.add('show');
      } else {
        if (data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) {
          // Recuperación ligera: reanudar la carga sin reiniciar el manifiesto completo
          // (recargar todo desde cero era lo que hacía que el stream "volviera al minuto 0"
          // y se quedara pegado). El watchdog de 3s se encarga de forzar una reconexión
          // completa solo si esto no resuelve el atasco.
          if (state.hls) {
            state.hls.startLoad();
          }
        }
      }
    });
    
    video.addEventListener('error', function onVideoError() {
      if (this._reloading) return;
      this._reloading = true;
      status.textContent = 'Reintentando...';
      setTimeout(() => {
        if (state.hls) {
          state.hls.loadSource(url);
          state.hls.attachMedia(video);
        }
        this._reloading = false;
      }, 1500);
      this.removeEventListener('error', onVideoError);
    }, {once: true});
    
  } else if(video.canPlayType('application/vnd.apple.mpegurl') || video.canPlayType('video/mp4')){
    status.textContent = 'Conectando…';
    video.preload = 'auto';
    video.src = url;
    video.addEventListener('loadedmetadata', ()=>{ 
      status.textContent = 'Reproduciendo'; 
      if (resumeTime > 0) {
        video.currentTime = resumeTime;
      }
      const playerBox = document.querySelector('.player-box');
      if (playerBox) {
        createPlayerControls(null, playerBox);
      }
      startContinueWatching();
      // Vigilar cada 3s que el video siga avanzando; si se congela, reconectar
      startPlaybackWatchdog(url);
    }, {once:true});
    video.play().catch(()=>{});
  } else {
    status.textContent = 'Formato no soportado aquí. Prueba con reproductor externo.';
    extBtn.classList.add('show');
  }
  video.addEventListener('error', ()=>{ status.classList.add('err'); status.textContent = 'Error al reproducir'; extBtn.classList.add('show'); }, {once:true});
  $$('.chan-card').forEach(el=>el.classList.remove('playing'));
}

function startContinueWatching() {
  if (continueUpdateInterval) clearInterval(continueUpdateInterval);
  continueUpdateInterval = setInterval(() => {
    if (video.duration > 0 && video.currentTime > 0 && state.currentPlaybackItem) {
      updateContinueWatching(state.currentPlaybackItem, video.currentTime, video.duration);
    }
  }, 5000);
}

function closePlayer(){
  // Guardar progreso final
  if (video.duration > 0 && video.currentTime > 0 && state.currentPlaybackItem) {
    updateContinueWatching(state.currentPlaybackItem, video.currentTime, video.duration);
  }
  if (continueUpdateInterval) {
    clearInterval(continueUpdateInterval);
    continueUpdateInterval = null;
  }
  stopPlaybackWatchdog();
  $('#player-overlay').classList.remove('show');
  extBtn.classList.remove('show');
  if(state.hls){ state.hls.destroy(); state.hls = null; }
  if (qualityBtn) { qualityBtn.remove(); qualityBtn = null; }
  if (qualityMenu) { qualityMenu.remove(); qualityMenu = null; }
  qualityMenuOpen = false;
  video.pause(); video.removeAttribute('src'); video.load();
  state.currentPlaybackItem = null;
}
function disconnectApp(){
  if(state.hls){ state.hls.destroy(); state.hls = null; }
  if (qualityBtn) { qualityBtn.remove(); qualityBtn = null; }
  if (qualityMenu) { qualityMenu.remove(); qualityMenu = null; }
  qualityMenuOpen = false;
  if (continueUpdateInterval) {
    clearInterval(continueUpdateInterval);
    continueUpdateInterval = null;
  }
  stopPlaybackWatchdog();
  video.pause(); video.removeAttribute('src'); video.load();
  $('#player-overlay').classList.remove('show');
  $('#app').classList.remove('show');
  $('#setup').style.display = 'flex';
  $('#x-user').value = ''; $('#x-pass').value = '';
  state = {mode:'xtream', connName:'', channels:[], categories:[], activeCategory:'all', activeType:'live', xtream:null, vod:[], vodCategories:[], series:[], seriesCategories:[], seriesEpisodesCache:{}, viewingSeries:null, hls:null, renderLimit:60, currentPlaybackItem:null};
  renderSavedProfiles();
  window.history.pushState(null, '', '');
}

// ===== AUTO-RECONNECT =====
async function tryAutoReconnect(){
  renderSavedProfiles();
  const saved = mostRecentProfile();
  if(!saved) return;
  const autoBox = $('#auto-reconnect');
  autoBox.style.display = 'flex';
  if(!SERVIDORES.includes(saved.xtream.server)){
    autoBox.style.display = 'none';
    return;
  }
  const ok = await connectXtream({ server: saved.xtream.server, user: saved.xtream.user, pass: saved.xtream.pass, name: saved.name });
  autoBox.style.display = 'none';
  if(!ok){ 
    $('#x-user').value = saved.xtream.user || '';
    $('#x-pass').value = saved.xtream.pass || '';
  }
}
tryAutoReconnect();

})();
</script>
